name: Restaurar visual aprobado de Jobtype

on:
  pull_request:
    branches:
      - fix-jobtype-restore-approved-visual
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de corrección
        uses: actions/checkout@v4
        with:
          ref: fix-jobtype-restore-approved-visual
          fetch-depth: 0

      - name: Descargar versión visual aprobada
        run: git fetch origin backup-jobtype-contrato-pre-kiro:refs/remotes/origin/backup-jobtype-contrato-pre-kiro

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Restaurar sólo la presentación aprobada dentro del CSS global
        shell: bash
        run: |
          set -euo pipefail
          python <<'PYCODE'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          approved_ref = 'origin/backup-jobtype-contrato-pre-kiro'

          def git_show(path: str) -> str:
              return subprocess.run(
                  ['git', 'show', f'{approved_ref}:{path}'],
                  check=True,
                  capture_output=True,
                  text=True
              ).stdout

          def extract_styles(path: str) -> str:
              source = git_show(path)
              blocks = re.findall(r'<style(?:\s+scoped)?[^>]*>(.*?)</style>', source, flags=re.S)
              cleaned = []
              for block in blocks:
                  block = re.sub(r':deep\(([^()]*)\)', r'\1', block)
                  cleaned.append(block.strip())
              return '\n\n'.join(cleaned)

          global_path = root / 'src/assets/css/fm-global.css'
          global_css = global_path.read_text(encoding='utf-8')

          patterns = [
              r'/\* ===== INICIO: jobtype-contrato-consolidado-final\.css ===== \*/.*?/\* ===== FIN: jobtype-contrato-consolidado-final\.css ===== \*/',
              r'/\* ===== INICIO: jobtype-contrato\.css ===== \*/.*?/\* ===== FIN: jobtype-contrato\.css ===== \*/',
              r'/\* ===== INICIO: jobtype-contrato-funcionalidades-kiro\.css ===== \*/.*?/\* ===== FIN: jobtype-contrato-funcionalidades-kiro\.css ===== \*/',
              r'/\* ===== INICIO: jobtype-contrato-visual-aprobado\.css ===== \*/.*?/\* ===== FIN: jobtype-contrato-visual-aprobado\.css ===== \*/'
          ]
          for pattern in patterns:
              global_css = re.sub(pattern, '', global_css, flags=re.S)
          global_css = global_css.rstrip()

          sources = [
              ('Pantalla principal aprobada', git_show('src/modules/parametrizaciones/jobtypeContrato/styles/jobtype-contrato.css')),
              ('Ajuste aprobado de Alta en una fila', git_show('src/modules/parametrizaciones/jobtypeContrato/styles/jobtypeContratoSingleRow.css')),
              ('Base aprobada de los diálogos', git_show('src/modules/parametrizaciones/jobtypeContrato/styles/jobtypeContratoDialogs.css')),
              ('Reglas locales aprobadas de la pantalla principal', extract_styles('src/modules/parametrizaciones/jobtypeContrato/pages/JobtypeContratoPage.vue')),
              ('Reglas locales aprobadas del popup de Alta', extract_styles('src/modules/parametrizaciones/jobtypeContrato/dialogs/AltaJobtypeContratoDialog.vue')),
              ('Reglas locales aprobadas del popup de Edición', extract_styles('src/modules/parametrizaciones/jobtypeContrato/dialogs/EditarJobtypeContratoDialog.vue')),
              ('Reglas locales aprobadas del popup de desactivación', extract_styles('src/modules/parametrizaciones/jobtypeContrato/dialogs/ConfirmarDesactivacionDialog.vue'))
          ]

          functionality = r'''
          /* Funcionalidad nueva sin alterar la presentación aprobada. */
          .jobtype-screen,
          body .p-dialog.joco-alta-dialog,
          body .p-dialog.joco-edit-dialog {
            position: relative;
          }

          #tabla-jobtype-contrato .p-datatable-tbody > tr.jobtype-row-inactive > td,
          #tabla-jobtype-contrato .p-datatable-tbody > tr.jobtype-row-inactive:hover > td,
          #tabla-jobtype-contrato .p-datatable-tbody > tr.jobtype-row-inactive.p-highlight > td {
            background: #edf0f2 !important;
            color: #75838b !important;
            font-weight: 400 !important;
            cursor: not-allowed !important;
          }

          #tabla-jobtype-contrato .p-datatable-tbody > tr.jobtype-row-inactive > td *,
          #tabla-jobtype-contrato .p-datatable-tbody > tr.jobtype-row-inactive:hover > td * {
            color: #75838b !important;
            font-weight: 400 !important;
          }

          .joco-alta-notice {
            grid-column: 1 / -1;
            min-height: 28px;
            display: flex;
            align-items: center;
            padding: 5px 9px;
            border: 1px solid #efc3c3;
            border-left: 3px solid #d9363e;
            border-radius: 3px;
            background: #fff7f7;
            color: #8f2027;
            font-size: 12px;
            line-height: 1.35;
          }

          body .p-dialog.joco-alta-dialog .fm-typing-loader,
          body .p-dialog.joco-edit-dialog .fm-typing-loader {
            z-index: 20;
            border-radius: inherit;
          }

          body .p-dialog.joco-alta-dialog button:disabled,
          body .p-dialog.joco-edit-dialog button:disabled {
            cursor: not-allowed;
          }
          '''
          functionality = re.sub(r'^          ', '', functionality, flags=re.M).strip()

          section_parts = [
              '/* ===== INICIO: jobtype-contrato-visual-aprobado.css ===== */',
              '''/*
               * CLASIFICACIÓN: [MÓDULO / PANTALLA]
               * PANTALLA: Parametrizaciones > Jobtype-Contrato.
               * FUENTE VISUAL: versión anterior a la integración Kiro.
               * OBJETIVO: conservar exactamente el popup, grilla y responsive aprobados.
               * FUNCIONALIDAD NUEVA: se agrega sin cambiar tamaños, posiciones ni cascada visual.
               * ÚNICA UBICACIÓN: fm-global.css.
               */'''
          ]
          for title, css in sources:
              section_parts.append(f'/* --- {title} --- */\n{css.strip()}')
          section_parts.extend([
              functionality,
              '/* ===== FIN: jobtype-contrato-visual-aprobado.css ===== */'
          ])

          global_path.write_text(global_css + '\n\n' + '\n\n'.join(section_parts) + '\n', encoding='utf-8')

          module = root / 'src/modules/parametrizaciones/jobtypeContrato'
          for vue in module.rglob('*.vue'):
              text = vue.read_text(encoding='utf-8')
              text = re.sub(r'\n?<style(?:\s+scoped)?[^>]*>.*?</style>\s*', '\n', text, flags=re.S)
              text = re.sub(r"^import ['\"].*jobtype.*\.css['\"]\s*\n", '', text, flags=re.M | re.I)
              vue.write_text(text.rstrip() + '\n', encoding='utf-8')

          styles_dir = module / 'styles'
          if styles_dir.exists():
              import shutil
              shutil.rmtree(styles_dir)

          parallel_css = root / 'src/assets/css/jobtype-contrato.css'
          if parallel_css.exists():
              parallel_css.unlink()

          main_path = root / 'src/main.js'
          main_text = main_path.read_text(encoding='utf-8')
          main_text = re.sub(r"^import ['\"].*(?:jobtype-contrato|jobtypeContrato).*\.css['\"]\s*\n", '', main_text, flags=re.M)
          main_path.write_text(main_text, encoding='utf-8')

          workflow = root / '.github/workflows/restore-jobtype-approved-visual.yml'
          if workflow.exists():
              workflow.unlink()
          PYCODE

      - name: Validar que sólo exista la fuente global
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'INICIO: jobtype-contrato-visual-aprobado.css' src/assets/css/fm-global.css)" -eq 1
          test "$(grep -c 'FIN: jobtype-contrato-visual-aprobado.css' src/assets/css/fm-global.css)" -eq 1
          ! grep -q 'jobtype-contrato-consolidado-final.css' src/assets/css/fm-global.css
          ! grep -R '<style' src/modules/parametrizaciones/jobtypeContrato --include='*.vue'
          test ! -d src/modules/parametrizaciones/jobtypeContrato/styles
          test ! -f src/assets/css/jobtype-contrato.css
          ! grep -R 'jobtype.*\.css' src/main.js src/modules/parametrizaciones/jobtypeContrato --include='*.js' --include='*.ts' --include='*.vue' -i
          grep -q "useExcelExport" src/modules/parametrizaciones/jobtypeContrato/pages/JobtypeContratoPage.vue
          grep -q "Jobtype_Contrato.xlsx" src/modules/parametrizaciones/jobtypeContrato/pages/JobtypeContratoPage.vue
          grep -q "duplicateMessage" src/modules/parametrizaciones/jobtypeContrato/dialogs/AltaJobtypeContratoDialog.vue
          grep -q "existeDuplicado" src/modules/parametrizaciones/jobtypeContrato/dialogs/EditarJobtypeContratoDialog.vue
          grep -q "rowSelectable" src/modules/parametrizaciones/jobtypeContrato/pages/JobtypeContratoPage.vue

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Confirmar restauración visual validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restaurar diseño aprobado y conservar funcionalidad de Jobtype"
          git push origin HEAD:fix-jobtype-restore-approved-visual
