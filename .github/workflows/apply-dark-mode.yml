name: Implementar modo oscuro aislado

on:
  pull_request:
    branches:
      - modo-oscuro
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama modo-oscuro
        uses: actions/checkout@v4
        with:
          ref: modo-oscuro
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Aplicar tema claro y oscuro
        run: python .github/scripts/run_apply_dark_mode.py

      - name: Validar integración
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/main.js
          node --check src/composables/useTheme.js
          grep -q "darkModeSelector: '.fm-dark'" src/main.js
          grep -q 'initializeTheme()' src/main.js
          grep -q 'data-fm-theme-bootstrap' index.html
          grep -q 'class="fm-theme-toggle"' src/components/CustomMenu.vue
          grep -q 'useTheme' src/components/CustomMenu.vue
          grep -q "const STORAGE_KEY = 'fm-theme'" src/composables/useTheme.js
          test "$(grep -c 'INICIO: modo-oscuro.css' src/assets/css/fm-global.css)" -eq 1
          test "$(grep -c 'FIN: modo-oscuro.css' src/assets/css/fm-global.css)" -eq 1

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Limpiar archivos técnicos y confirmar implementación
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_dark_mode.py
          rm -f .github/scripts/run_apply_dark_mode.py
          rm -f .github/workflows/apply-dark-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implementar selector de modo claro y oscuro"
          git push origin HEAD:modo-oscuro
