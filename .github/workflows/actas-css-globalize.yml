name: Gestion Actas CSS consolidation

on:
  push:
    branches:
      - feat-actas-stepper-multiseleccion
    paths:
      - '.github/workflows/actas-css-globalize.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat-actas-stepper-multiseleccion
          fetch-depth: 0

      - name: Consolidate Gestion de Actas styles
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          global_css = root / 'src/assets/css/fm-global.css'
          tmp_css = root / 'src/assets/css/gestion-actas-global.tmp.css'
          demo = root / 'src/modules/gestionActas/components/ActasWorkspaceDemo.vue'
          grid = root / 'src/modules/gestionActas/components/ActasWorkspaceGrid.vue'

          def extract_scoped_style(path: Path, label: str) -> str:
              text = path.read_text(encoding='utf-8')
              match = re.search(r'\n<style\s+scoped>\s*(.*?)\s*</style>\s*$', text, flags=re.S)
              if not match:
                  return ''
              css = match.group(1).strip()
              css = re.sub(r':deep\(([^()]*)\)', r'\1', css)
              css = re.sub(r':global\(([^()]*)\)', r'\1', css)
              path.write_text(text[:match.start()].rstrip() + '\n', encoding='utf-8')
              return f'\n/* --- {label} (antes scoped) --- */\n{css}\n'

          demo_css = extract_scoped_style(demo, 'ActasWorkspaceDemo.vue')
          grid_css = extract_scoped_style(grid, 'ActasWorkspaceGrid.vue')

          demo_text = demo.read_text(encoding='utf-8')
          demo_text = demo_text.replace(
              '<div class="actas-demo-workspace">',
              '<div class="gestion-actas-module actas-demo-workspace">',
              1,
          )
          demo.write_text(demo_text, encoding='utf-8')

          custom_css = tmp_css.read_text(encoding='utf-8') if tmp_css.exists() else ''
          current = global_css.read_text(encoding='utf-8').rstrip()
          block = (
              '\n\n/* ================================================================\n'
              '   INICIO: GESTIÓN DE ACTAS\n'
              '   ACTAS / NOTA DÉBITO / NOTA CRÉDITO / OTS SIN ACTA\n'
              '   ÚNICA UBICACIÓN DE ESTILOS DEL MÓDULO: fm-global.css\n'
              '   ================================================================ */\n'
              + demo_css
              + grid_css
              + custom_css.strip()
              + '\n/* ================================================================\n'
                '   FIN: GESTIÓN DE ACTAS\n'
                '   ================================================================ */\n'
          )
          global_css.write_text(current + block, encoding='utf-8')

          obsolete = [
              tmp_css,
              root / 'src/modules/gestionActas/ConsultarActasStepperV2.vue',
              root / 'src/modules/gestionActas/actasPrototypeEnhancements.js',
              root / 'src/modules/gestionActas/actasPrototypeEnhancements.css',
              root / 'src/modules/gestionActas/actasPrototypeGridFullscreenFix.css',
              root / 'src/modules/gestionActas/actasPrototypeGridStickyFinal.css',
              root / 'src/modules/gestionActas/actasPrototypeGridViewportFill.css',
              root / 'src/modules/gestionActas/actasWorkspaceDemoMount.css',
          ]
          for path in obsolete:
              if path.exists():
                  path.unlink()

          workflow = root / '.github/workflows/actas-css-globalize.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit consolidated module
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(actas): globalizar estilos y retirar prototipo legacy"
          git push origin HEAD:feat-actas-stepper-multiseleccion
