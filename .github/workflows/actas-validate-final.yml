name: Validate Gestion Actas final

on:
  push:
    branches:
      - feat-actas-stepper-multiseleccion
    paths:
      - '.github/workflows/actas-validate-final.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat-actas-stepper-multiseleccion
          fetch-depth: 0

      - name: Scope migrated state helpers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/assets/css/fm-global.css')
          text = path.read_text(encoding='utf-8')
          marker = 'INICIO: GESTIÓN DE ACTAS'
          idx = text.find(marker)
          if idx == -1:
              raise SystemExit('No se encontró el bloque global de Gestión de Actas')
          prefix = text[:idx]
          block = text[idx:]
          for name in ('success', 'info', 'warning', 'danger', 'neutral'):
              block = block.replace(f'\n.is-{name}{{', f'\n.actas-demo-workspace .is-{name}{{', 1)
          path.write_text(prefix + block, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build

      - name: Remove temporary workflow
        run: rm -f .github/workflows/actas-validate-final.yml

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(actas): validar build y acotar estilos globales"
          git push origin HEAD:feat-actas-stepper-multiseleccion
