name: Documentar fm-global.css

on:
  push:
    branches:
      - consolidar-estilos-globales

permissions:
  contents: write

concurrency:
  group: documentar-fm-global-css
  cancel-in-progress: true

jobs:
  documentar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: consolidar-estilos-globales
          fetch-depth: 0

      - name: Agregar documentación sin modificar reglas
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          css_path = Path('src/assets/css/fm-global.css')
          original = css_path.read_text(encoding='utf-8')

          TOP_START = '/* === INICIO DOCUMENTACION GENERAL FM-GLOBAL === */'
          TOP_END = '/* === FIN DOCUMENTACION GENERAL FM-GLOBAL === */'
          SECTION_START = '/* --- INICIO DOCUMENTACION DE SECCION --- */'
          SECTION_END = '/* --- FIN DOCUMENTACION DE SECCION --- */'

          def remove_generated_docs(text: str) -> str:
              text = re.sub(
                  re.escape(TOP_START) + r'.*?' + re.escape(TOP_END) + r'\n*',
                  '',
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  re.escape(SECTION_START) + r'.*?' + re.escape(SECTION_END) + r'\n*',
                  '',
                  text,
                  flags=re.S,
              )
              return text

          base = remove_generated_docs(original)

          top_doc = f'''{TOP_START}
/*
 * GUÍA DE MANTENIMIENTO DE FM-GLOBAL.CSS
 * ======================================
 *
 * Este archivo reúne los estilos que antes estaban separados en distintas hojas.
 * Los comentarios no cambian la cascada CSS: sirven para indicar alcance, riesgo
 * y pantallas afectadas antes de modificar una regla.
 *
 * CLASIFICACIÓN UTILIZADA
 * -----------------------
 * [GLOBAL CRÍTICO - NO TOCAR POR UNA SOLA PANTALLA]
 *   Reglas base compartidas por toda la aplicación. Un cambio puede afectar menú,
 *   formularios, grillas, diálogos, paginadores y todas las pantallas migradas.
 *   Para corregir una pantalla puntual, crear una regla acotada bajo la clase raíz
 *   de esa pantalla en lugar de modificar estos bloques.
 *
 * [GLOBAL COMPARTIDO - MODIFICAR CON PRUEBA REGRESIVA]
 *   Reglas reutilizadas por varios módulos. Pueden tocarse únicamente cuando el
 *   cambio deba aplicarse a todos los consumidores del componente compartido.
 *
 * [MÓDULO / PANTALLA]
 *   Reglas acotadas a una pantalla o familia concreta. Los ajustes deben conservar
 *   siempre la clase raíz del módulo para no filtrarse a otras vistas.
 *
 * [IFRAME LEGACY]
 *   Reglas inyectadas dentro de páginas antiguas cargadas en iframe. No gobiernan
 *   directamente los componentes Vue migrados.
 *
 * [ARCHIVADO - INACTIVO]
 *   Código histórico conservado dentro de @media not all. No participa de la UI.
 *   No debe activarse sin una revisión completa de conflictos y especificidad.
 *
 * REGLA GENERAL
 * -------------
 * Nunca resolver un problema visual de una sola pantalla modificando un bloque
 * marcado como GLOBAL CRÍTICO. Primero usar la clase raíz del módulo, por ejemplo:
 * .report-sas-page, .busqueda-ots-page, .ot-fallidas-ct o .jobtype-screen.
 *
 * ÍNDICE RÁPIDO
 * -------------
 * Globales críticos: fm-global, fm-responsive, desktop/notebook, menú y spacing.
 * Globales compartidos: grillas, selects y estados vacíos.
 * Módulos: Reporte SAS, Jobtype/CMO y Parametrizaciones.
 * Legacy: responsive de páginas cargadas dentro de iframe.
 * Archivados: fm-report-sas-fullscreen y nuestros.css.
 */
{TOP_END}

'''

          docs = {
              'fm-global.css': '''
 * CLASIFICACIÓN: [GLOBAL CRÍTICO - NO TOCAR POR UNA SOLA PANTALLA]
 * PANTALLAS AFECTADAS: toda la aplicación Vue y todos los módulos migrados.
 * RESPONSABILIDAD:
 *   - variables de diseño, colores, tipografía, bordes, radios y sombras;
 *   - normalización de html, body, #app y box-sizing;
 *   - contenedores fm-screen, tarjetas, paneles y acordeones compartidos;
 *   - filtros, campos, inputs, botones y estados disabled/focus;
 *   - estructura base de grillas, tablas, filas, filtros y paginadores;
 *   - diálogos, alertas, calendario, loader y menú base;
 *   - breakpoints genéricos para tablet y móvil.
 * ADVERTENCIA: no modificar para corregir Reporte SAS, Búsqueda de OTs,
 * Registro OTs Fallidas, Jobtype o CMO de manera aislada. Crear una regla
 * específica bajo la clase raíz de la pantalla correspondiente.
''',
              'fm-grid-resize.css': '''
 * CLASIFICACIÓN: [GLOBAL COMPARTIDO - MODIFICAR CON PRUEBA REGRESIVA]
 * PANTALLAS AFECTADAS: todas las grillas PrimeVue con fm-pass-grid/fm-pt-datatable;
 * además contiene ajustes dirigidos a Registro OTs Fallidas, Emulación y Reporte SAS.
 * RESPONSABILIDAD:
 *   - visibilidad de fila de filtros;
 *   - controlador de redimensionamiento de columnas;
 *   - cursores y estados durante el resize;
 *   - estados visuales de filas seleccionadas, deshabilitadas y reprocesadas.
 * ADVERTENCIA: las reglas generales de resize no deben tocarse por una sola tabla.
 * Los selectores que comienzan con #tabla.otf-grid pertenecen a OTs Fallidas.
''',
              'fm-responsive.css': '''
 * CLASIFICACIÓN: [GLOBAL CRÍTICO - NO TOCAR POR UNA SOLA PANTALLA]
 * PANTALLAS AFECTADAS: todas las pantallas migradas, componentes compartidos,
 * grillas, formularios, diálogos, paginadores e iframes contenedores.
 * RESPONSABILIDAD:
 *   - variables responsive y tamaños mínimos;
 *   - distribución flexible y grillas de formularios;
 *   - scroll horizontal controlado de DataTable;
 *   - dimensiones responsive de diálogos y paginadores;
 *   - comportamiento para 1366, 1180, 1024, 900, 768 y 600 px.
 * ADVERTENCIA: es el sistema responsive general. Para una pantalla concreta,
 * agregar un selector con su clase raíz dentro del bloque específico del módulo.
''',
              'fm-legacy-responsive.css': '''
 * CLASIFICACIÓN: [IFRAME LEGACY]
 * PANTALLAS AFECTADAS: páginas antiguas abiertas mediante IframeView/DetalleView,
 * por ejemplo Gestión de Actas, reglas, notas y otras rutas aún no migradas.
 * RESPONSABILIDAD:
 *   - adaptar formularios, tablas, paginadores, diálogos y barras de acciones legacy;
 *   - agregar scroll y límites de viewport dentro del documento del iframe;
 *   - mejorar uso táctil y reducir movimiento cuando el sistema lo solicita.
 * ADVERTENCIA: este bloque es extraído por responsiveIframes.js e inyectado dentro
 * del iframe. No usarlo para corregir componentes Vue migrados.
''',
              'fm-menu-responsive.css': '''
 * CLASIFICACIÓN: [GLOBAL CRÍTICO - MENÚ]
 * PANTALLAS AFECTADAS: navegación principal de todas las rutas autenticadas.
 * RESPONSABILIDAD:
 *   - comportamiento del menubar en notebook, tablet y móvil;
 *   - apertura, posición y ancho de submenús;
 *   - controles táctiles, scroll y adaptación del panel de navegación.
 * ADVERTENCIA: no modificar por una opción puntual del menú. Los cambios afectan
 * la navegación completa y deben probarse en escritorio, notebook y móvil.
''',
              'fm-menu-tuning.css': '''
 * CLASIFICACIÓN: [GLOBAL CRÍTICO - MENÚ]
 * PANTALLAS AFECTADAS: cabecera, menú principal y sector de usuario en toda la app.
 * RESPONSABILIDAD:
 *   - apariencia general del menú y sus enlaces;
 *   - perfil del usuario, icono, datos y cierre de sesión;
 *   - sombras, bordes, hover, estados activos y franja decorativa.
 * ADVERTENCIA: no usar este bloque para ajustar contenido interno de una pantalla.
''',
              'fm-report-sas-auto-height.css': '''
 * CLASIFICACIÓN: [MÓDULO / PANTALLA]
 * PANTALLA AFECTADA: Reporte SAS.
 * CLASES PRINCIPALES: .report-sas-page, .report-sas-grid-shell y .report-sas-grid.
 * RESPONSABILIDAD:
 *   - altura automática de la grilla;
 *   - uso del espacio disponible entre cabecera, tabla y paginador;
 *   - prevención de scroll duplicado y cortes verticales.
 * MODIFICACIÓN: puede ajustarse para Reporte SAS, manteniendo siempre sus clases raíz.
''',
              'fm-report-sas-fullscreen.css': '''
 * CLASIFICACIÓN: [ARCHIVADO - INACTIVO]
 * PANTALLA HISTÓRICA: Reporte SAS.
 * ESTADO: conservado dentro de @media not all; no participa de la cascada actual.
 * RESPONSABILIDAD HISTÓRICA: forzar Reporte SAS a pantalla completa.
 * ADVERTENCIA: no quitar @media not all ni reactivar estas reglas. Existe una
 * implementación actual de tamaño completo y activarlo duplicaría especificidad.
''',
              'fm-select.css': '''
 * CLASIFICACIÓN: [GLOBAL COMPARTIDO - MODIFICAR CON PRUEBA REGRESIVA]
 * PANTALLAS AFECTADAS: todos los Select y MultiSelect compartidos de PrimeVue.
 * RESPONSABILIDAD:
 *   - altura, tipografía, padding, iconos y panel desplegable;
 *   - estados focus, disabled, hover y selección;
 *   - consistencia visual de combos entre módulos.
 * ADVERTENCIA: para un combo particular usar una clase del módulo. No cambiar este
 * bloque para resolver solamente un Select de Jobtype, Reporte SAS u OTs Fallidas.
''',
              'jobtype-contrato.css': '''
 * CLASIFICACIÓN: [MÓDULO / FAMILIA DE PANTALLAS]
 * PANTALLAS AFECTADAS: Configuración Jobtype–Contrato y CMO–Actividad cuando
 * reutilizan clases .jobtype-* y sus componentes compartidos.
 * RESPONSABILIDAD:
 *   - distribución de filtros, resultados, grillas y botones;
 *   - modales de alta, modificación y confirmación;
 *   - dimensiones y comportamiento visual de la familia Jobtype.
 * ADVERTENCIA: aunque el nombre diga contrato, varias reglas son compartidas con CMO.
 * Revisar ambas pantallas antes de modificar un selector .jobtype-* genérico.
''',
              'parametrizaciones-panel-accent.css': '''
 * CLASIFICACIÓN: [MÓDULO / FAMILIA DE PANTALLAS]
 * PANTALLAS AFECTADAS: Jobtype–Contrato y CMO–Actividad.
 * RESPONSABILIDAD:
 *   - ancho final de paneles de parametrizaciones;
 *   - línea turquesa vertical continua debajo de la cabecera;
 *   - superposición del acento sobre filtros, tabla y paginador.
 * ADVERTENCIA: conservar el pseudo-elemento y verificar ambas parametrizaciones.
''',
              'jobtype-required-validation.css': '''
 * CLASIFICACIÓN: [MÓDULO / FAMILIA DE PANTALLAS]
 * PANTALLAS AFECTADAS: formularios y diálogos Jobtype–Contrato/CMO–Actividad.
 * RESPONSABILIDAD:
 *   - marca visual de campos obligatorios;
 *   - estados inválidos y mensajes de validación;
 *   - consistencia de borde/foco en formularios Jobtype.
 * MODIFICACIÓN: limitar cualquier nueva regla a las clases del diálogo correspondiente.
''',
              'parametrizaciones-grid-selection.css': '''
 * CLASIFICACIÓN: [MÓDULO / FAMILIA DE PANTALLAS]
 * PANTALLAS AFECTADAS: grillas de Jobtype–Contrato y CMO–Actividad.
 * RESPONSABILIDAD:
 *   - color de fila seleccionada;
 *   - hover, checkbox y estados de selección;
 *   - prioridad visual sobre estilos generales de DataTable.
 * ADVERTENCIA: no trasladar estas reglas a .fm-pass-grid global porque cambiaría
 * todas las tablas migradas.
''',
              'fm-grid-empty-state.css': '''
 * CLASIFICACIÓN: [GLOBAL COMPARTIDO - MODIFICAR CON PRUEBA REGRESIVA]
 * PANTALLAS AFECTADAS: todas las grillas que usan el estado vacío compartido.
 * RESPONSABILIDAD:
 *   - apariencia de “sin resultados”;
 *   - altura mínima, fondo, alineación y mensaje vacío;
 *   - compatibilidad con distintas clases de PrimeVue para empty message.
 * ADVERTENCIA: un cambio se verá en Reporte SAS, Búsqueda de OTs, OTs Fallidas
 * y otras tablas migradas.
''',
              'fm-desktop-notebook-responsive.css': '''
 * CLASIFICACIÓN: [GLOBAL CRÍTICO - NO TOCAR POR UNA SOLA PANTALLA]
 * PANTALLAS AFECTADAS: layout general en 1920×1080, 1366×768, 1280×720 y 1024×768.
 * RESPONSABILIDAD:
 *   - altura disponible debajo del menú;
 *   - contenedores principales, scroll y viewport;
 *   - adaptación de tablas, filtros y diálogos a notebook/escritorio.
 * ADVERTENCIA: modificar solo para una corrección transversal validada en todas
 * las resoluciones objetivo.
''',
              'fm-desktop-notebook-modules.css': '''
 * CLASIFICACIÓN: [MULTI-MÓDULO - MODIFICAR CON PRUEBA REGRESIVA]
 * PANTALLAS AFECTADAS: Jobtype–Contrato, CMO–Actividad, Búsqueda de OTs,
 * Registro OTs Fallidas y Reporte SAS.
 * RESPONSABILIDAD:
 *   - correcciones puntuales de altura y flex para módulos con medidas históricas;
 *   - expansión de grillas y contenido de acordeones;
 *   - adaptación de modales Jobtype en notebook y 1024 px.
 * ADVERTENCIA: revisar el selector antes de tocarlo: algunos son multi-módulo y
 * otros están dirigidos específicamente a .jobtype-, .busqueda-ots-, .otf- o .report-sas-.
''',
              'fm-menu-spacing.css': '''
 * CLASIFICACIÓN: [GLOBAL CRÍTICO - MENÚ Y LAYOUT]
 * PANTALLAS AFECTADAS: todas las rutas mostradas dentro del layout principal.
 * RESPONSABILIDAD:
 *   - altura efectiva de cabecera;
 *   - separación inferior del menú;
 *   - posición de .main-home y cálculo del área de contenido.
 * ADVERTENCIA: cambiar estos valores desplaza todas las pantallas verticalmente.
''',
              'fm-menu-submenu-compact.css': '''
 * CLASIFICACIÓN: [GLOBAL CRÍTICO - SUBMENÚS]
 * PANTALLAS AFECTADAS: todos los submenús del menú principal.
 * RESPONSABILIDAD:
 *   - fondo blanco de desplegables;
 *   - altura compacta de filas, padding y tipografía;
 *   - divisores, hover turquesa y eliminación de separaciones excesivas.
 * ADVERTENCIA: mantener este bloque al final de los estilos de menú porque su orden
 * asegura que PrimeVue no restablezca fondos grises o alturas mayores.
''',
              'nuestros.css': '''
 * CLASIFICACIÓN: [ARCHIVADO - INACTIVO]
 * ALCANCE HISTÓRICO: reglas antiguas globales de PrimeVue, botones y menubar.
 * ESTADO: conservado dentro de @media not all; no participa de la cascada actual.
 * ADVERTENCIA: no activar. Sus selectores globales entrarían en conflicto con
 * fm-global.css, fm-menu-tuning.css y fm-menu-submenu-compact.css.
''',
          }

          missing = []
          documented = base
          for name, description in docs.items():
              marker = f'/* ===== INICIO: {name} ===== */'
              if documented.count(marker) != 1:
                  missing.append(name)
                  continue
              block = (
                  marker
                  + '\n'
                  + SECTION_START
                  + '\n/*'
                  + description.rstrip()
                  + '\n */\n'
                  + SECTION_END
              )
              documented = documented.replace(marker, block, 1)

          if missing:
              raise SystemExit(f'No se encontraron secciones para documentar: {missing}')

          documented = top_doc + documented.lstrip()

          # Garantiza que solo se agregaron comentarios y que ninguna regla cambió.
          restored = remove_generated_docs(documented)
          if restored != base.lstrip():
              raise SystemExit('La documentación alteró contenido CSS fuera de comentarios')

          if documented.count(SECTION_START) != len(docs):
              raise SystemExit('No todas las secciones recibieron documentación')

          css_path.write_text(documented, encoding='utf-8')
          PY

      - name: Instalar dependencias
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Validar compilación
        run: npm run build

      - name: Validar diferencias
        run: git diff --check

      - name: Guardar documentación
        shell: bash
        run: |
          rm -f .github/workflows/documentar-fm-global.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Documentar alcance de estilos globales y por pantalla"
          git push origin HEAD:consolidar-estilos-globales
