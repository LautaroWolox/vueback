name: Actualizar visual de Emulación

on:
  push:
    branches:
      - Emulacion

permissions:
  contents: write

jobs:
  update-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama Emulacion
        uses: actions/checkout@v4
        with:
          ref: Emulacion
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Aplicar cambios y centralizar CSS
        shell: bash
        run: |
          set -euo pipefail
          python <<'PYCODE'
          from pathlib import Path
          import re

          module = Path('src/modules/emulacion')
          global_css_path = Path('src/assets/css/fm-global.css')

          legajo_path = module / 'components/filtros/inputs/Legajo.vue'
          confirmar_path = module / 'components/ConfirmarEmulacionDialog.vue'
          tabla_path = module / 'components/TablaEmulacion.vue'

          legajo = legajo_path.read_text(encoding='utf-8')
          legajo = legajo.replace('<label for="legajo">Legajo</label>', '<label for="legajo">LEGAJO</label>', 1)
          legajo = legajo.replace('<i class="pi pi-id-card"></i>', '<i class="pi pi-user"></i>', 1)
          legajo_path.write_text(legajo, encoding='utf-8')

          for path in (confirmar_path, tabla_path):
              text = path.read_text(encoding='utf-8')
              text = text.replace('class="emulation-profile-chip"', 'class="emulation-profile-item"')
              text = text.replace('<i class="pi pi-shield"></i>', '<i class="pi pi-key"></i>')
              path.write_text(text, encoding='utf-8')

          # Extraer todos los estilos locales del módulo para mantener una única fuente global.
          extracted = []
          for path in sorted(module.rglob('*.vue')):
              text = path.read_text(encoding='utf-8')
              blocks = re.findall(r'<style(?:\s+scoped|\s+scope)?[^>]*>(.*?)</style>', text, flags=re.S)
              if not blocks:
                  continue

              normalized = []
              for block in blocks:
                  block = re.sub(r':global\(([^()]*)\)', r'\1', block)
                  block = re.sub(r':deep\(([^()]*)\)', r'\1', block)
                  normalized.append(block.strip())

              extracted.append(f'/* --- {path.as_posix()} --- */\n' + '\n\n'.join(normalized))
              text = re.sub(r'\n?<style(?:\s+scoped|\s+scope)?[^>]*>.*?</style>\s*', '\n', text, flags=re.S)
              path.write_text(text.rstrip() + '\n', encoding='utf-8')

          css = global_css_path.read_text(encoding='utf-8')
          start = '/* ===== INICIO: emulacion.css ===== */'
          end = '/* ===== FIN: emulacion.css ===== */'
          css = re.sub(re.escape(start) + r'.*?' + re.escape(end), '', css, flags=re.S).rstrip()

          overrides = r'''
/* Ajustes solicitados para LEGAJO e identificación de perfiles. */
.emulation-legajo-icon {
  border: 0 !important;
  border-radius: 8px !important;
  background: #dff3f5 !important;
  color: #0098aa !important;
  box-shadow: none !important;
}

.emulation-legajo-icon i {
  font-size: 16px !important;
}

.emulation-profile-list {
  display: flex !important;
  flex-wrap: wrap !important;
  gap: 7px 16px !important;
}

.emulation-profile-item {
  min-height: 22px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #176171;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
  box-sizing: border-box;
}

.emulation-profile-item i {
  width: 14px;
  color: #00a9bd;
  font-size: 11px;
  text-align: center;
  flex: 0 0 14px;
}

.emulation-profile-item span {
  white-space: nowrap;
}
'''.strip()

          section = '\n\n'.join([
              start,
              '''/*
 * CLASIFICACIÓN: [MÓDULO / PANTALLA]
 * PANTALLA: Emulación.
 * ÚNICA FUENTE DE ESTILOS: src/assets/css/fm-global.css.
 * Los componentes del módulo no contienen bloques <style>.
 */''',
              *extracted,
              overrides,
              end
          ])

          global_css_path.write_text(css + '\n\n' + section + '\n', encoding='utf-8')
          PYCODE

      - name: Validar estructura y cambios
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '<label for="legajo">LEGAJO</label>' src/modules/emulacion/components/filtros/inputs/Legajo.vue
          grep -q 'pi pi-user' src/modules/emulacion/components/filtros/inputs/Legajo.vue
          grep -q 'emulation-profile-item' src/modules/emulacion/components/ConfirmarEmulacionDialog.vue
          grep -q 'emulation-profile-item' src/modules/emulacion/components/TablaEmulacion.vue
          grep -q 'pi pi-key' src/modules/emulacion/components/ConfirmarEmulacionDialog.vue
          grep -q 'pi pi-key' src/modules/emulacion/components/TablaEmulacion.vue
          ! grep -R '<style' src/modules/emulacion --include='*.vue'
          test "$(grep -c 'INICIO: emulacion.css' src/assets/css/fm-global.css)" -eq 1
          test "$(grep -c 'FIN: emulacion.css' src/assets/css/fm-global.css)" -eq 1

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Limpiar y confirmar cambios
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-emulacion-visual.yml
          rm -f .github/emulacion-visual.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar visual de legajo y perfiles en Emulación"
          git push origin HEAD:Emulacion
