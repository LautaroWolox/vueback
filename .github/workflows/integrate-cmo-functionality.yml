name: Integrar funcionalidad CMO sobre main

on:
  pull_request:
    branches:
      - CMO
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama CMO
        uses: actions/checkout@v4
        with:
          ref: CMO
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Aplicar funcionalidad sin reemplazar la arquitectura
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cmo-payload
          cat <<'PAYLOAD' | base64 -d > /tmp/cmo-payload/cmo.tar.gz

PAYLOAD
          echo 'd79ed20386b10ae572e622bf1d340cc57a7c2f62c65aa0d5b0df3a0cf62bab3c  /tmp/cmo-payload/cmo.tar.gz' | sha256sum -c -
          tar -xzf /tmp/cmo-payload/cmo.tar.gz -C /tmp/cmo-payload

          cp -f /tmp/cmo-payload/src/modules/parametrizaciones/jobtypeCMO/JobtypeCMO.vue src/modules/parametrizaciones/jobtypeCMO/JobtypeCMO.vue
          cp -f /tmp/cmo-payload/src/modules/parametrizaciones/jobtypeCMO/components/AltaDialog.vue src/modules/parametrizaciones/jobtypeCMO/components/AltaDialog.vue
          cp -f /tmp/cmo-payload/src/modules/parametrizaciones/jobtypeCMO/components/AltaDialogBackend.vue src/modules/parametrizaciones/jobtypeCMO/components/AltaDialogBackend.vue
          cp -f /tmp/cmo-payload/src/modules/parametrizaciones/jobtypeCMO/components/ModificarDialog.vue src/modules/parametrizaciones/jobtypeCMO/components/ModificarDialog.vue
          cp -f /tmp/cmo-payload/src/modules/parametrizaciones/jobtypeCMO/components/Tabla.vue src/modules/parametrizaciones/jobtypeCMO/components/Tabla.vue

          python <<'PYCODE'
          from pathlib import Path
          import re

          css_path = Path('src/assets/css/fm-global.css')
          css = css_path.read_text(encoding='utf-8')
          section = Path('/tmp/cmo-payload/cmo-actividad.css').read_text(encoding='utf-8').strip()
          start = '/* ===== INICIO: cmo-actividad.css ===== */'
          end = '/* ===== FIN: cmo-actividad.css ===== */'
          css = re.sub(re.escape(start) + r'.*?' + re.escape(end), '', css, flags=re.S).rstrip()
          css_path.write_text(css + '\n\n' + section + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/integrate-cmo-functionality.yml')
          if workflow.exists():
              workflow.unlink()
          PYCODE

      - name: Validar estructura y reglas del módulo
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c 'INICIO: cmo-actividad.css' src/assets/css/fm-global.css)" -eq 1
          test "$(grep -c 'FIN: cmo-actividad.css' src/assets/css/fm-global.css)" -eq 1
          ! grep -R '<style' src/modules/parametrizaciones/jobtypeCMO --include='*.vue'
          ! find src/modules/parametrizaciones/jobtypeCMO -type f -name '*.css' | grep -q .
          grep -q 'cmo-actividad-page' src/modules/parametrizaciones/jobtypeCMO/JobtypeCMO.vue
          grep -q 'rowSelectable' src/modules/parametrizaciones/jobtypeCMO/components/Tabla.vue
          grep -q 'cmo-row-inactive' src/modules/parametrizaciones/jobtypeCMO/components/Tabla.vue
          grep -q 'font-weight: 700' src/assets/css/fm-global.css
          grep -q '#9ee7ee' src/assets/css/fm-global.css
          grep -q 'FmTypingLoader' src/modules/parametrizaciones/jobtypeCMO/components/AltaDialogBackend.vue
          grep -q 'FmTypingLoader' src/modules/parametrizaciones/jobtypeCMO/components/ModificarDialog.vue
          grep -q 'existsActiveRelation' src/modules/parametrizaciones/jobtypeCMO/components/AltaDialogBackend.vue
          grep -q 'existsActiveDuplicate' src/modules/parametrizaciones/jobtypeCMO/components/ModificarDialog.vue
          grep -q 'Configuracion_CMO_Actividad.xlsx' src/modules/parametrizaciones/jobtypeCMO/components/Tabla.vue
          test ! -f .github/workflows/integrate-cmo-functionality.yml

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Confirmar integración validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrar funcionalidad completa de CMO"
          git push origin HEAD:CMO
