name: Validar ABM Materiales Final

on:
  push:
    branches:
      - ABM-Materiales
    paths:
      - .github/workflows/validate-abm-materiales-final.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build
