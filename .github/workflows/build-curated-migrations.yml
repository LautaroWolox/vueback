name: Preparar migraciones seleccionadas

on:
  pull_request:
    branches:
      - migraciones-reporte-emulacion-certificacion
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: migraciones-reporte-emulacion-certificacion
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Aplicar alcance solicitado
        run: python .github/scripts/run_curated_migrations_v2.py

      - name: Validar estructura y rutas
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/router/index.js
          node --check src/modules/certificacionContratista/api/certificacionApi.js

          test -d src/modules/reporteSas
          test -d src/modules/emulacion
          test -d src/modules/certificacionContratista

          test ! -e src/modules/gestionMateriales/abmMateriales
          test ! -e src/modules/parametrizaciones/jobtypeContrato
          test ! -e src/modules/parametrizaciones/jobtypeCMO
          test ! -e src/modules/buscadorOts
          test ! -e src/modules/otFallidasCT
          test ! -e src/modules/certificacionContratista/views/BusquedaOtsView.vue
          test ! -e src/modules/certificacionContratista/dialogs/CambioTecnicoDialog.vue

          grep -q "component: () => import('../modules/reporteSas/ReporteSAS.vue')" src/router/index.js
          grep -q "component: () => import('../modules/emulacion/views/Emulacion.vue')" src/router/index.js
          grep -q "certificacionContratista/views/DocumentosListView.vue" src/router/index.js
          grep -q "certificacionContratista/views/DocumentoDetalleView.vue" src/router/index.js

          grep -A8 "path: 'abmMateriales.html'" src/router/index.js | grep -q "IframeView.vue"
          grep -A8 "path: 'jobtypeContrato.html'" src/router/index.js | grep -q "IframeView.vue"
          grep -A8 "path: 'jobtypeCMO.html'" src/router/index.js | grep -q "IframeView.vue"
          grep -A8 "path: 'registroOTFallidasReproceso.html'" src/router/index.js | grep -q "IframeView.vue"
          grep -A8 "path: 'busquedaOtsGcc.html'" src/router/index.js | grep -q "IframeView.vue"

          ! grep -q "gestionMateriales/abmMateriales" src/router/index.js
          ! grep -q "parametrizaciones/jobtypeContrato" src/router/index.js
          ! grep -q "parametrizaciones/jobtypeCMO" src/router/index.js
          ! grep -q "modules/buscadorOts" src/router/index.js
          ! grep -q "modules/otFallidasCT" src/router/index.js
          ! grep -q "BusquedaOtsView.vue" src/router/index.js

          test "$(grep -c 'INICIO: certificacion-contratista.css' src/assets/css/fm-global.css)" -eq 1
          test "$(grep -c 'FIN: certificacion-contratista.css' src/assets/css/fm-global.css)" -eq 1
          ! grep -q 'INICIO: abm-materiales.css' src/assets/css/fm-global.css
          ! grep -q 'INICIO: jobtype-contrato.css' src/assets/css/fm-global.css
          ! grep -q 'INICIO: jobtype-contrato-main-funcionalidad.css' src/assets/css/fm-global.css
          ! grep -q 'INICIO: cmo-actividad.css' src/assets/css/fm-global.css

          grep -q '>LEGAJO<' src/modules/emulacion/components/filtros/inputs/Legajo.vue
          grep -q 'pi pi-user' src/modules/emulacion/components/filtros/inputs/Legajo.vue
          grep -q 'emulation-profile-item' src/modules/emulacion/components/ConfirmarEmulacionDialog.vue
          grep -q 'emulation-profile-item' src/modules/emulacion/components/TablaEmulacion.vue

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Limpiar archivos técnicos y confirmar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/prepare_curated_migrations.py
          rm -f .github/scripts/run_curated_migrations_v2.py
          rm -f .github/workflows/build-curated-migrations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Conservar sólo Reporte SAS, Emulación y Certificación"
          git push origin HEAD:migraciones-reporte-emulacion-certificacion
