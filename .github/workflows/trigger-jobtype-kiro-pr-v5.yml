name: Validar integración Jobtype Kiro v5

on:
  pull_request:
    branches:
      - jobtype-contrato-integracion-kiro
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de integración
        uses: actions/checkout@v4
        with:
          ref: jobtype-contrato-integracion-kiro
          fetch-depth: 0

      - name: Descargar respaldo visual
        run: git fetch origin backup-jobtype-contrato-pre-kiro:refs/remotes/origin/backup-jobtype-contrato-pre-kiro

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar funcionalidad completa conservando estructura
        shell: bash
        run: |
          set -euo pipefail
          python <<'PYCODE'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/trigger-jobtype-kiro-pr.yml').read_text(encoding='utf-8')
          match = re.search(r"          python <<'PYCODE'\n(.*?)\n          PYCODE", source, flags=re.S)
          if not match:
              raise SystemExit('No se encontró el script de integración original')

          script = textwrap.dedent(match.group(1))
          temp_payload = "Path('.github/jobtype-kiro-payload')"
          script = script.replace(
              "(payload_dir / 'jobtype-additions.css')",
              f"({temp_payload} / 'jobtype-additions.css')"
          )
          old_copy = (
              "for source, destination in mapping.items():\n"
              "    destination.parent.mkdir(parents=True, exist_ok=True)\n"
              "    shutil.copyfile(payload_dir / source, destination)\n"
          )
          new_copy = (
              "for source, destination in mapping.items():\n"
              "    destination.parent.mkdir(parents=True, exist_ok=True)\n"
              "    source_path = payload_dir / source\n"
              "    if not source_path.exists():\n"
              "        source_path = Path('.github/jobtype-kiro-payload') / source\n"
              "    if not source_path.exists():\n"
              "        raise FileNotFoundError(f'Falta el insumo {source}')\n"
              "    shutil.copyfile(source_path, destination)\n"
          )
          if old_copy not in script:
              raise SystemExit('No se encontró el bloque de copia original')
          script = script.replace(old_copy, new_copy)

          exec(compile(script, '<jobtype-kiro-migration>', 'exec'))

          temp_dir = Path('.github/jobtype-kiro-payload')
          if temp_dir.exists():
              import shutil
              shutil.rmtree(temp_dir)

          for workflow in [
              Path('.github/workflows/trigger-jobtype-kiro-pr-v2.yml'),
              Path('.github/workflows/trigger-jobtype-kiro-pr-v3.yml'),
              Path('.github/workflows/trigger-jobtype-kiro-pr-v4.yml'),
              Path('.github/workflows/trigger-jobtype-kiro-pr-v5.yml'),
          ]:
              if workflow.exists():
                  workflow.unlink()
          PYCODE

      - name: Validar centralización y estructura
        shell: bash
        run: |
          set -euo pipefail
          grep -q "INICIO: jobtype-contrato-consolidado-final.css" src/assets/css/fm-global.css
          grep -q "INICIO: jobtype-contrato-funcionalidades-kiro.css" src/assets/css/fm-global.css
          ! grep -R "<style" src/modules/parametrizaciones/jobtypeContrato --include='*.vue'
          ! grep -R "jobtypeContrato/styles" src/main.js src/modules/parametrizaciones/jobtypeContrato --include='*.js' --include='*.ts' --include='*.vue'
          test ! -d src/modules/parametrizaciones/jobtypeContrato/styles
          test ! -d .github/jobtype-kiro-payload
          grep -q "rowSelectable" src/modules/parametrizaciones/jobtypeContrato/pages/JobtypeContratoPage.vue
          grep -q "isExistingActiveRelation" src/modules/parametrizaciones/jobtypeContrato/dialogs/AltaJobtypeContratoDialog.vue
          grep -q "existeDuplicado" src/modules/parametrizaciones/jobtypeContrato/dialogs/EditarJobtypeContratoDialog.vue
          grep -q "clearError" src/modules/parametrizaciones/jobtypeContrato/store/jobtypeContratoStore.ts
          grep -q "origen" src/modules/parametrizaciones/jobtypeContrato/api/jobtypeContratoApi.ts

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Confirmar cambios validados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrar nuevas funcionalidades de Jobtype-Contrato"
          git push origin HEAD:jobtype-contrato-integracion-kiro
