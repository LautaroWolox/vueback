          css_path.write_text(css + '\n', encoding='utf-8')

          # Fachadas antiguas se eliminan sólo si ya no son referenciadas.
          for path in [
              root / 'src/modules/gestionActas/services/gestionActasLegacyApi.js',
              root / 'src/modules/gestionActas/services/gestionActasOperationsApi.js',
          ]:
              if path.exists():
                  name = path.name
                  refs = []
                  for candidate in (root / 'src').rglob('*'):
                      if not candidate.is_file() or candidate == path:
                          continue
                      if candidate.suffix not in {'.vue', '.js', '.ts'}:
                          continue
                      try:
                          if name.replace('.js', '') in candidate.read_text(encoding='utf-8'):
                              refs.append(str(candidate))
                      except UnicodeDecodeError:
                          pass
                  if not refs:
                      path.unlink()
          PY

      - name: Verify no HTTP facade imports remain
        run: |
          ! grep -R "gestionActasLegacyApi\|gestionActasOperationsApi" src/modules/gestionActas --include='*.vue' --include='*.js' --include='*.ts'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Remove temporary workflow
        run: rm -f .github/workflows/actas-normalize-migrated-ui.yml

      - name: Commit normalized module
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(actas): unificar UI migrada, full grid y multi OT"
          git push origin HEAD:feat-actas-stepper-multiseleccion
