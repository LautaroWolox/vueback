name: Integrar funcionalidad Jobtype sobre main

on:
  pull_request:
    branches:
      - jobtype-contrato-funcionalidad-main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama nueva basada en main
        uses: actions/checkout@v4
        with:
          ref: jobtype-contrato-funcionalidad-main
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Mantener visual de main e integrar sólo funcionalidad
        shell: bash
        run: |
          set -euo pipefail
          python <<'PYCODE'
          from pathlib import Path
          import re

          root = Path('.')
          module = root / 'src/modules/parametrizaciones/jobtypeContrato'
          parent_path = module / 'JobtypeContrato.vue'
          table_path = module / 'components/Tabla.vue'
          alta_path = module / 'components/AltaDialog.vue'
          edit_path = module / 'components/EditarDialog.vue'
          confirm_path = module / 'components/ConfirmarDesactivacionDialog.vue'
          store_path = module / 'store/jobtypeContratoStore.ts'
          global_path = root / 'src/assets/css/fm-global.css'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'No se encontró el bloque requerido: {label}')
              return text.replace(old, new, 1)

          def extract_styles(source: str) -> str:
              blocks = re.findall(r'<style(?:\s+scoped|\s+scope)?[^>]*>(.*?)</style>', source, flags=re.S)
              cleaned = []
              for block in blocks:
                  block = re.sub(r':global\(([^()]*)\)', r'\1', block)
                  block = re.sub(r':deep\(([^()]*)\)', r'\1', block)
                  cleaned.append(block.strip())
              return '\n\n'.join(cleaned)

          # -----------------------------------------------------------------
          # 1. Conservar exactamente los estilos locales de main, pero moverlos
          #    físicamente a fm-global.css como única fuente del módulo.
          # -----------------------------------------------------------------
          visual_sources = []
          for path, title in [
              (parent_path, 'Pantalla principal de main'),
              (alta_path, 'Popup de Alta de main'),
              (edit_path, 'Popup de Edición de main'),
              (confirm_path, 'Confirmación de desactivación de main')
          ]:
              source = path.read_text(encoding='utf-8')
              css = extract_styles(source)
              if css:
                  visual_sources.append(f'/* --- {title} --- */\n{css}')

          global_css = global_path.read_text(encoding='utf-8')
          marker_start = '/* ===== INICIO: jobtype-contrato-main-funcionalidad.css ===== */'
          marker_end = '/* ===== FIN: jobtype-contrato-main-funcionalidad.css ===== */'
          global_css = re.sub(
              re.escape(marker_start) + r'.*?' + re.escape(marker_end),
              '',
              global_css,
              flags=re.S
          ).rstrip()

          functional_css = r'''
          /* Funcionalidad nueva. No modifica las medidas ni la distribución de main. */
          body .p-dialog.jobtype-alta-dialog,
          body .p-dialog.jobtype-contrato-edit-dialog {
            position: relative;
          }

          #tabla-jobtype-contrato .p-datatable-tbody > tr.jobtype-row-inactive > td,
          #tabla-jobtype-contrato .p-datatable-tbody > tr.jobtype-row-inactive:hover > td,
          #tabla-jobtype-contrato .p-datatable-tbody > tr.jobtype-row-inactive.p-highlight > td {
            background: #edf0f2 !important;
            color: #75838b !important;
            font-weight: 400 !important;
            cursor: not-allowed !important;
          }

          #tabla-jobtype-contrato .p-datatable-tbody > tr.jobtype-row-inactive > td * {
            color: #75838b !important;
            font-weight: 400 !important;
          }
          '''
          functional_css = re.sub(r'^          ', '', functional_css, flags=re.M).strip()

          section = '\n\n'.join([
              marker_start,
              '''/*
               * CLASIFICACIÓN: [MÓDULO / PANTALLA]
               * PANTALLA: Parametrizaciones > Jobtype-Contrato.
               * BASE VISUAL: rama main, sin reemplazar templates ni medidas.
               * FUNCIONALIDAD: origen, duplicados, filas inactivas, loaders y Excel.
               * ÚNICA UBICACIÓN DE ESTILOS DEL MÓDULO: fm-global.css.
               */''',
              *visual_sources,
              functional_css,
              marker_end
          ])
          global_path.write_text(global_css + '\n\n' + section + '\n', encoding='utf-8')

          # -----------------------------------------------------------------
          # 2. Pantalla principal: conservar template de main y sumar integración.
          # -----------------------------------------------------------------
          parent = parent_path.read_text(encoding='utf-8')
          parent = replace_once(
              parent,
              '<LoadingOverlay :loading="store.loading" />',
              '<LoadingOverlay :loading="store.loading && !showAlta && !showEditar && !showDesactivar" />',
              'loader principal'
          )
          parent = replace_once(parent, '        <Tabla\n', '        <Tabla\n          ref="tablaRef"\n', 'referencia de la tabla')
          parent = replace_once(parent, '@add="showAlta = true"', '@add="abrirAlta"', 'apertura de Alta')
          parent = replace_once(
              parent,
              '      :tarea-contrato-id="editForm.tareaContratoId"\n      :jobtype="editForm.jobtype"',
              '      :tarea-contrato-id="editForm.tareaContratoId"\n      :contrato-tipo-id="editForm.contratoTipoId"\n      :jobtype-codigo="editForm.jobtypeCodigo"\n      :jobtype="editForm.jobtype"',
              'props de Edición'
          )
          parent = replace_once(
              parent,
              '      :pais="editForm.pais"\n      @actualizado="onActualizado"',
              '      :pais="editForm.pais"\n      :origen-actual="editForm.origenActual"\n      @actualizado="onActualizado"',
              'origen actual de Edición'
          )
          parent = replace_once(
              parent,
              '    <ConfirmarDesactivacionDialog\n      v-model:visible="showDesactivar"\n      @confirmar="onDesactivacionConfirmada"\n    />\n  </div>',
              '    <ConfirmarDesactivacionDialog\n      v-model:visible="showDesactivar"\n      @confirmar="onDesactivacionConfirmada"\n    />\n\n    <FmAlertDialog\n      v-model:visible="showError"\n      title="Error"\n      :message="errorMessage"\n    />\n  </div>',
              'alerta principal'
          )

          parent_script = r'''<script setup>
          import { ref, computed, nextTick, onMounted, onBeforeUnmount } from 'vue'
          import { FilterMatchMode } from '@primevue/core/api'
          import FmButton from '@/components/shared/FmButton.vue'
          import FmAlertDialog from '@/components/shared/FmAlertDialog.vue'
          import LoadingOverlay from '@/modules/shared/components/LoadingOverlay.vue'
          import Tabla from './components/Tabla.vue'
          import AltaDialog from './components/AltaDialog.vue'
          import EditarDialog from './components/EditarDialog.vue'
          import ConfirmarDesactivacionDialog from './components/ConfirmarDesactivacionDialog.vue'
          import { useJobtypeContratoStore } from './store/jobtypeContratoStore'
          import { useExcelExport } from '@/composables/useExportExcel'

          const store = useJobtypeContratoStore()
          const tablaRef = ref(null)
          const { exportToExcel } = useExcelExport()

          const filtersExpanded = ref(true)
          const resultsExpanded = ref(false)
          const selectedRow = ref(null)
          const mainFirst = ref(0)
          const mainPageRows = ref(100)
          const showAlta = ref(false)
          const showEditar = ref(false)
          const showDesactivar = ref(false)
          const showError = ref(false)
          const localError = ref('')

          let popupButtonObserver = null
          let popupButtonFrame = null

          const popupButtonSelector = [
            '.p-dialog .jobtype-add-button',
            '.p-dialog .jobtype-relate-button',
            '.p-dialog .jobtype-contrato-edit-update',
            '.jobtype-alta-unsaved-dialog .jobtype-alta-unsaved__button',
            '.jobtype-contrato-unsaved-dialog .jobtype-contrato-unsaved__button',
            '.jobtype-contrato-delete-confirm-dialog .jobtype-contrato-delete-confirm__button'
          ].join(', ')

          const setImportantStyle = (element, property, value) => {
            if (
              element.style.getPropertyValue(property) === value &&
              element.style.getPropertyPriority(property) === 'important'
            ) return

            element.style.setProperty(property, value, 'important')
          }

          const applyPopupButtonDesign = () => {
            document.querySelectorAll(popupButtonSelector).forEach((button) => {
              if (!(button instanceof HTMLElement)) return

              const label = button.textContent?.trim().toUpperCase() ?? ''
              const isOutline = label.includes('CANCELAR') || label.includes('RECHAZAR')

              button.dataset.jobtypePopupButton = 'true'
              button.dataset.jobtypePopupButtonVariant = isOutline ? 'outline' : 'primary'

              setImportantStyle(button, 'width', 'auto')
              setImportantStyle(button, 'min-width', '110px')
              setImportantStyle(button, 'max-width', 'none')
              setImportantStyle(button, 'height', '34px')
              setImportantStyle(button, 'min-height', '34px')
              setImportantStyle(button, 'max-height', '34px')
              setImportantStyle(button, 'padding', '0 16px')
              setImportantStyle(button, 'border-radius', '8px')
              setImportantStyle(button, 'gap', '7px')
              setImportantStyle(button, 'font-size', '12px')
              setImportantStyle(button, 'font-weight', '600')
              setImportantStyle(button, 'line-height', '1')
              setImportantStyle(button, 'box-shadow', '0 4px 12px rgba(0, 73, 84, 0.13)')
              setImportantStyle(button, 'transform', 'none')
            })
          }

          const schedulePopupButtonDesign = () => {
            if (popupButtonFrame !== null) return

            popupButtonFrame = requestAnimationFrame(() => {
              popupButtonFrame = null
              applyPopupButtonDesign()
            })
          }

          const editForm = ref({
            tareaContratoId: 0,
            contratoTipoId: 0,
            jobtypeCodigo: '',
            jobtype: '',
            contratoActual: '',
            pais: '',
            origenActual: ''
          })

          const columns = [
            { field: 'tareaContratoId', header: '', width: '0', hidden: true, exportable: false, filter: false, sort: false },
            { field: 'tareaId', header: '', width: '0', hidden: true, exportable: false, filter: false, sort: false },
            { field: 'contratoTipoId', header: '', width: '0', hidden: true, exportable: false, filter: false, sort: false },
            { field: 'tareaCodigo', header: 'CODIGO_TAREA', width: '12.5%', exportable: true, filter: true, sort: true },
            { field: 'tareaNombre', header: 'TAREA', width: '12.5%', exportable: true, filter: true, sort: true },
            { field: 'contratoNombre', header: 'NOMBRE_CONTRATO', width: '12.5%', exportable: true, filter: true, sort: true },
            { field: 'origen', header: 'ORIGEN', width: '12.5%', exportable: true, filter: true, sort: true },
            { field: 'legajoModificacion', header: 'USUARIO_MODIFICACION', width: '12.5%', exportable: true, filter: true, sort: true },
            { field: 'fechaModificacion', header: 'FECHA_MODIFICACION', width: '12.5%', exportable: true, filter: true, sort: true },
            { field: 'activo', header: 'ACTIVO', width: '12.5%', exportable: true, filter: true, sort: true },
            { field: 'pais', header: 'PAIS', width: '12.5%', exportable: true, filter: true, sort: true }
          ]

          const visibleColumns = computed(() => columns.filter((col) => !col.hidden))
          const errorMessage = computed(() => localError.value || store.error || 'Error de conexión. Contacte al administrador')

          const mainFilters = ref(
            Object.fromEntries(
              visibleColumns.value.map(({ field }) => [field, { value: null, matchMode: FilterMatchMode.CONTAINS }])
            )
          )

          const normalize = (value) => String(value ?? '').trim().toUpperCase()
          const isRowActive = (row) => normalize(row?.activo) !== 'N'
          const puedeOperarSeleccion = computed(() => Boolean(selectedRow.value && isRowActive(selectedRow.value)))

          const reportError = (error) => {
            localError.value = error instanceof Error
              ? error.message
              : (store.error || 'Error de conexión. Contacte al administrador')
            showError.value = true
          }

          const buscar = async () => {
            resultsExpanded.value = true
            mainFirst.value = 0
            selectedRow.value = null
            localError.value = ''

            try {
              await store.fetchRelaciones()
            } catch (error) {
              reportError(error)
            }
          }

          const abrirAlta = async () => {
            localError.value = ''
            try {
              await store.fetchRelaciones()
              showAlta.value = true
            } catch (error) {
              reportError(error)
            }
          }

          const editarSeleccionado = () => {
            if (!puedeOperarSeleccion.value) return

            editForm.value = {
              tareaContratoId: selectedRow.value.tareaContratoId,
              contratoTipoId: selectedRow.value.contratoTipoId,
              jobtypeCodigo: selectedRow.value.tareaCodigo ?? '',
              jobtype: selectedRow.value.tareaNombre ?? '',
              contratoActual: selectedRow.value.contratoNombre ?? '',
              pais: selectedRow.value.pais ?? '',
              origenActual: selectedRow.value.origen ?? ''
            }
            showEditar.value = true
          }

          const solicitarDesactivacion = () => {
            if (!puedeOperarSeleccion.value) return
            showDesactivar.value = true
          }

          const onDesactivacionConfirmada = async () => {
            if (!puedeOperarSeleccion.value) return

            try {
              await store.desactivarRelacion(selectedRow.value.tareaContratoId)
              selectedRow.value = null
              await store.fetchRelaciones()
            } catch (error) {
              reportError(error)
            }
          }

          const refrescarDespuesDeCambio = async () => {
            selectedRow.value = null
            mainFirst.value = 0
            resultsExpanded.value = true
            try {
              await store.fetchRelaciones()
            } catch (error) {
              reportError(error)
            }
          }

          const onRelacionado = () => refrescarDespuesDeCambio()
          const onActualizado = () => refrescarDespuesDeCambio()

          const exportarExcel = async () => {
            const exportData = tablaRef.value?.getExportData?.()
            const rows = exportData?.rows ?? []
            const fields = exportData?.fields ?? []
            if (!rows.length || !fields.length) return

            const exportColumns = columns.filter((column) => fields.includes(column.field))

            try {
              await exportToExcel({
                rows,
                fields,
                columns: exportColumns,
                filename: 'Jobtype_Contrato.xlsx'
              })
            } catch (error) {
              reportError(error)
            }
          }

          onMounted(async () => {
            await nextTick()
            applyPopupButtonDesign()

            popupButtonObserver = new MutationObserver(schedulePopupButtonDesign)
            popupButtonObserver.observe(document.body, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['class', 'style']
            })
          })

          onBeforeUnmount(() => {
            popupButtonObserver?.disconnect()
            popupButtonObserver = null

            if (popupButtonFrame !== null) {
              cancelAnimationFrame(popupButtonFrame)
              popupButtonFrame = null
            }
          })
          </script>'''
          parent_script = re.sub(r'^          ', '', parent_script, flags=re.M)
          parent = re.sub(r'<script setup>.*?</script>', parent_script, parent, count=1, flags=re.S)
          parent = re.sub(r'\n?<style(?:\s+scoped|\s+scope)?[^>]*>.*?</style>\s*', '\n', parent, flags=re.S)
          parent_path.write_text(parent.rstrip() + '\n', encoding='utf-8')

          # -----------------------------------------------------------------
          # 3. Tabla de main: bloquear relaciones inactivas y exponer datos.
          # -----------------------------------------------------------------
          table = table_path.read_text(encoding='utf-8')
          table = replace_once(table, '    id="tabla-jobtype-contrato"\n', '    id="tabla-jobtype-contrato"\n    ref="dataTableRef"\n', 'ref de DataTable')
          table = replace_once(
              table,
              '    selectionMode="single"\n    paginator',
              '    selectionMode="single"\n    :rowSelectable="isRowSelectable"\n    :rowClass="rowClass"\n    paginator',
              'filas seleccionables'
          )
          table = table.replace(':delete-disabled="!selectionModel"', ':delete-disabled="!canOperate"')
          table = table.replace(':edit-disabled="!selectionModel"', ':edit-disabled="!canOperate"')

          table_script = r'''<script setup>
          import { computed, ref } from 'vue'
          import DataTable from 'primevue/datatable'
          import Column from 'primevue/column'
          import InputText from 'primevue/inputtext'
          import FmGridPaginator from '@/components/shared/FmGridPaginator.vue'
          import FmGridActions from '@/components/shared/FmGridActions.vue'

          const props = defineProps({
            relaciones: { type: Array, default: () => [] },
            columns: { type: Array, default: () => [] },
            filters: { type: Object, required: true },
            selectedRow: { type: Object, default: null },
            first: { type: Number, default: 0 },
            rows: { type: Number, default: 100 }
          })

          const emit = defineEmits([
            'update:filters',
            'update:selectedRow',
            'update:first',
            'update:rows',
            'export',
            'delete',
            'edit',
            'add'
          ])

          const dataTableRef = ref(null)

          const filtersModel = computed({
            get: () => props.filters,
            set: (value) => emit('update:filters', value)
          })

          const selectionModel = computed({
            get: () => props.selectedRow,
            set: (value) => emit('update:selectedRow', value)
          })

          const firstModel = computed({
            get: () => props.first,
            set: (value) => emit('update:first', value)
          })

          const rowsModel = computed({
            get: () => props.rows,
            set: (value) => emit('update:rows', value)
          })

          const normalize = (value) => String(value ?? '').trim().toUpperCase()
          const isRowActive = (row) => normalize(row?.activo) !== 'N'
          const isRowSelectable = (event) => isRowActive(event?.data ?? event)
          const rowClass = (row) => isRowActive(row) ? '' : 'jobtype-row-inactive fm-disabled-row'
          const canOperate = computed(() => Boolean(selectionModel.value && isRowActive(selectionModel.value)))

          const onRowClick = ({ data }) => {
            emit('update:selectedRow', isRowActive(data) ? data : null)
          }

          const clearFilter = (filterModel, filterCallback) => {
            filterModel.value = null
            filterCallback()
          }

          const getExportData = () => {
            const rows = dataTableRef.value?.filteredValue ?? props.relaciones
            const fields = props.columns
              .filter((column) => column.exportable !== false)
              .map((column) => column.field)
            return { rows, fields }
          }

          defineExpose({ getExportData })
          </script>'''
          table_script = re.sub(r'^          ', '', table_script, flags=re.M)
          table = re.sub(r'<script setup>.*?</script>', table_script, table, count=1, flags=re.S)
          table_path.write_text(table.rstrip() + '\n', encoding='utf-8')

          # -----------------------------------------------------------------
          # 4. Alta: mismo popup de main, con validaciones y persistencia nueva.
          # -----------------------------------------------------------------
          alta = alta_path.read_text(encoding='utf-8')
          alta = replace_once(
              alta,
              '    @update:visible="onVisibleChange"\n  >',
              '    @update:visible="onVisibleChange"\n  >\n    <FmTypingLoader\n      v-if="submitting"\n      overlay\n      title="Relacionando"\n      message="Guardando relaciones Jobtype-Contrato"\n    />',
              'loader de Alta'
          )
          alta = replace_once(alta, '          aria-label="Cerrar"\n          @click="solicitarCierre"', '          aria-label="Cerrar"\n          :disabled="submitting"\n          @click="solicitarCierre"', 'cierre bloqueado Alta')
          alta = replace_once(alta, '            class="jobtype-alta-control"\n            style="width: 120px', '            class="jobtype-alta-control"\n            :disabled="submitting"\n            style="width: 120px', 'país bloqueado Alta')
          alta = alta.replace('            :minLength="4"\n            class="jobtype-alta-autocomplete"', '            :minLength="4"\n            :disabled="submitting"\n            class="jobtype-alta-autocomplete"', 2)
          alta = replace_once(
              alta,
              '            overlayClass="jobtype-alta-select-overlay"\n            class="jobtype-alta-control"\n            style="width: 120px',
              '            overlayClass="jobtype-alta-select-overlay"\n            class="jobtype-alta-control"\n            :disabled="submitting || form.pais === \'2\'"\n            style="width: 120px',
              'origen bloqueado Alta'
          )
          alta = replace_once(alta, '          class="jobtype-add-button"\n          style=', '          class="jobtype-add-button"\n          :disabled="!canAgregar || submitting"\n          style=', 'botón Agregar')
          alta = alta.replace(':delete-disabled="!altaSelectedRow"', ':delete-disabled="!altaSelectedRow || submitting"')
          alta = alta.replace(':disabled="altaRows.length === 0"', ':disabled="altaRows.length === 0 || submitting"')
          alta = replace_once(
              alta,
              '  </Dialog>\n</template>',
              '  </Dialog>\n\n  <FmAlertDialog\n    v-model:visible="showAlert"\n    title="Atención"\n    :message="alertMessage"\n  />\n</template>',
              'alerta de Alta'
          )

          alta_script = r'''<script setup>
          import { ref, reactive, computed, watch } from 'vue'
          import Dialog from 'primevue/dialog'
          import Select from 'primevue/select'
          import AutoComplete from 'primevue/autocomplete'
          import DataTable from 'primevue/datatable'
          import Column from 'primevue/column'
          import FmButton from '@/components/shared/FmButton.vue'
          import FmGridPaginator from '@/components/shared/FmGridPaginator.vue'
          import FmGridActions from '@/components/shared/FmGridActions.vue'
          import FmAlertDialog from '@/components/shared/FmAlertDialog.vue'
          import FmTypingLoader from '@/components/shared/FmTypingLoader.vue'
          import { useJobtypeContratoStore } from '../store/jobtypeContratoStore'

          const props = defineProps({
            visible: { type: Boolean, default: false }
          })

          const emit = defineEmits(['update:visible', 'relacionado'])
          const store = useJobtypeContratoStore()

          const altaDialogStyle = 'width: calc(100vw - 48px) !important; max-width: 1440px !important; height: min(680px, calc(100dvh - 48px)) !important; max-height: calc(100dvh - 48px) !important; margin: 0 !important;'
          const confirmDialogStyle = 'width: min(540px, calc(100vw - 32px)); max-width: 540px;'

          const paisOptions = [
            { label: '', value: '' },
            { label: 'ARG/UY', value: '1' },
            { label: 'PY', value: '2' }
          ]

          const form = reactive({ pais: '1', jobtype: '', contrato: '', origen: 'FAN' })
          const jobtypeSuggestions = ref([])
          const contratoSuggestions = ref([])
          const jobtypeSelected = ref(null)
          const contratoSelected = ref(null)
          const altaRows = ref([])
          const altaSelectedRow = ref(null)
          const altaFirst = ref(0)
          const altaPageRows = ref(10)
          const showConfirmCierre = ref(false)
          const validationRequested = ref(false)
          const showAlert = ref(false)
          const alertMessage = ref('')
          const submitting = ref(false)

          const normalize = (value) => String(value ?? '').trim().toUpperCase()
          const normalizeCountry = (value) => {
            const country = normalize(value).replaceAll(' ', '')
            if (['1', 'ARG/UY', 'ARGUY', 'ARGENTINA/URUGUAY'].includes(country)) return 'ARG/UY'
            if (['2', 'PY', 'PARAGUAY'].includes(country)) return 'PY'
            return normalize(value)
          }

          const origenOptions = computed(() => form.pais === '2'
            ? [{ label: 'FAN', value: 'FAN' }]
            : [
                { label: '', value: '' },
                { label: 'FAN', value: 'FAN' },
                { label: 'MXM', value: 'MXM' }
              ]
          )

          const canAgregar = computed(() => Boolean(
            form.pais && jobtypeSelected.value && contratoSelected.value && form.origen
          ))
          const jobtypeInvalid = computed(() => validationRequested.value && !jobtypeSelected.value)
          const contratoInvalid = computed(() => validationRequested.value && !contratoSelected.value)
          const jobtypeInputClass = computed(() => [
            'jobtype-alta-control',
            { 'jobtype-alta-control--invalid': jobtypeInvalid.value }
          ])
          const contratoInputClass = computed(() => [
            'jobtype-alta-control',
            { 'jobtype-alta-control--invalid': contratoInvalid.value }
          ])
          const hayDatosCargados = computed(() => Boolean(
            form.jobtype || form.contrato || jobtypeSelected.value || contratoSelected.value || altaRows.value.length
          ))

          watch(() => form.pais, (pais) => {
            form.jobtype = ''
            form.contrato = ''
            form.origen = pais ? 'FAN' : ''
            jobtypeSelected.value = null
            contratoSelected.value = null
          })

          watch(() => form.jobtype, (value) => {
            if (jobtypeSelected.value && value !== jobtypeSelected.value) jobtypeSelected.value = null
          })

          watch(() => form.contrato, (value) => {
            if (contratoSelected.value && value !== contratoSelected.value) contratoSelected.value = null
          })

          watch(() => props.visible, (visible) => {
            if (visible) resetForm()
          })

          const resetForm = () => {
            form.pais = '1'
            form.jobtype = ''
            form.contrato = ''
            form.origen = 'FAN'
            jobtypeSelected.value = null
            contratoSelected.value = null
            altaRows.value = []
            altaSelectedRow.value = null
            altaFirst.value = 0
            showConfirmCierre.value = false
            validationRequested.value = false
            showAlert.value = false
            alertMessage.value = ''
            submitting.value = false
            store.clearError()
          }

          const buscarJobtypes = async (event) => {
            jobtypeSuggestions.value = await store.buscarJobtypes(event.query, form.pais)
          }

          const buscarContratos = async (event) => {
            contratoSuggestions.value = await store.buscarContratos(event.query)
          }

          const onJobtypeSelect = (event) => { jobtypeSelected.value = event.value }
          const onContratoSelect = (event) => { contratoSelected.value = event.value }
          const onAltaRowClick = ({ data }) => { altaSelectedRow.value = data }

          const previewKey = (row) => [
            normalize(row.relCodigoTarea),
            Number(row.relContratoId || 0),
            normalize(row.origen),
            normalizeCountry(row.paisLabel || row.pais)
          ].join('|')

          const isExistingActiveRelation = (preview) => store.relaciones.some((row) => {
            if (normalize(row.activo) === 'N') return false

            const sameTask = normalize(row.tareaCodigo) === normalize(preview.relCodigoTarea)
            const sameContract = Number(row.contratoTipoId || 0) === Number(preview.relContratoId || 0) ||
              normalize(row.contratoNombre) === normalize(preview.relContrato)
            const sameOrigin = normalize(row.origen) === normalize(preview.origen)
            const sameCountry = normalizeCountry(row.pais) === normalizeCountry(preview.paisLabel || preview.pais)
            return sameTask && sameContract && sameOrigin && sameCountry
          })

          const agregar = () => {
            validationRequested.value = true
            if (!canAgregar.value || submitting.value) return

            const paisLabel = normalizeCountry(form.pais)
            const nuevaFila = {
              id: `${Date.now()}-${jobtypeSelected.value.codigo}-${contratoSelected.value.contratoId}`,
              relCodigoTarea: jobtypeSelected.value.codigo,
              relTarea: jobtypeSelected.value.nombre,
              relContratoId: Number(contratoSelected.value.contratoId),
              relContrato: contratoSelected.value.nombre,
              origen: form.origen,
              pais: paisLabel,
              paisLabel
            }

            if (altaRows.value.some((row) => previewKey(row) === previewKey(nuevaFila))) {
              alertMessage.value = `La relación ${nuevaFila.relCodigoTarea} / ${nuevaFila.relContrato} / ${nuevaFila.origen} ya fue agregada.`
              showAlert.value = true
              return
            }

            if (isExistingActiveRelation(nuevaFila)) {
              alertMessage.value = 'La relación Jobtype / Contrato / País / Origen ya existe y se encuentra activa.'
              showAlert.value = true
              return
            }

            altaRows.value = [...altaRows.value, nuevaFila]
            altaSelectedRow.value = nuevaFila
            form.jobtype = ''
            form.contrato = ''
            form.origen = form.pais === '2' ? 'FAN' : ''
            jobtypeSelected.value = null
            contratoSelected.value = null
            validationRequested.value = false
          }

          const eliminarPreview = () => {
            if (!altaSelectedRow.value || submitting.value) return
            altaRows.value = altaRows.value.filter((row) => row.id !== altaSelectedRow.value.id)
            altaSelectedRow.value = null
          }

          const relacionar = async () => {
            if (!altaRows.value.length || submitting.value) return

            const duplicates = altaRows.value.filter(isExistingActiveRelation)
            if (duplicates.length) {
              alertMessage.value = `Ya existe una relación activa para: ${duplicates.map((row) => row.relCodigoTarea).join(', ')}.`
              showAlert.value = true
              return
            }

            submitting.value = true
            store.clearError()
            try {
              const errores = await store.crearRelaciones(
                altaRows.value.map(({ relCodigoTarea, relTarea, relContratoId, relContrato, origen, pais }) => ({
                  relCodigoTarea,
                  relTarea,
                  relContratoId,
                  relContrato,
                  origen,
                  pais
                }))
              )

              if (errores.length) {
                alertMessage.value = errores
                  .map((error) => error.mensaje || `No se pudo relacionar ${error.tareaCodigo}`)
                  .join('\n')
                showAlert.value = true
                return
              }

              cerrar()
              emit('relacionado')
            } catch (error) {
              alertMessage.value = error instanceof Error
                ? error.message
                : (store.error || 'Error de conexión. Contacte al administrador')
              showAlert.value = true
            } finally {
              submitting.value = false
            }
          }

          const solicitarCierre = () => {
            if (submitting.value) return
            if (hayDatosCargados.value) {
              showConfirmCierre.value = true
              return
            }
            cerrar()
          }

          const onVisibleChange = (visible) => {
            if (!visible) solicitarCierre()
          }

          const cancelarCierre = () => { showConfirmCierre.value = false }
          const confirmarCierre = () => {
            showConfirmCierre.value = false
            cerrar()
          }

          const cerrar = () => {
            resetForm()
            emit('update:visible', false)
          }
          </script>'''
          alta_script = re.sub(r'^          ', '', alta_script, flags=re.M)
          alta = re.sub(r'<script setup>.*?</script>', alta_script, alta, count=1, flags=re.S)
          alta = re.sub(r'\n?<style(?:\s+scoped|\s+scope)?[^>]*>.*?</style>\s*', '\n', alta, flags=re.S)
          alta_path.write_text(alta.rstrip() + '\n', encoding='utf-8')

          # -----------------------------------------------------------------
          # 5. Edición: mismo popup de main, con origen y duplicados reales.
          # -----------------------------------------------------------------
          edit = edit_path.read_text(encoding='utf-8')
          edit = replace_once(
              edit,
              '    @update:visible="onVisibleChange"\n  >',
              '    @update:visible="onVisibleChange"\n  >\n    <FmTypingLoader\n      v-if="store.loading"\n      overlay\n      title="Actualizando relación"\n      message="Guardando los cambios"\n    />',
              'loader de Edición'
          )
          edit = replace_once(edit, '          aria-label="Cerrar"\n          @click="solicitarCierre"', '          aria-label="Cerrar"\n          :disabled="store.loading"\n          @click="solicitarCierre"', 'cierre bloqueado Edición')
          edit = replace_once(edit, '          :minLength="4"\n          class="jobtype-contrato-edit-autocomplete"', '          :minLength="4"\n          :disabled="store.loading"\n          class="jobtype-contrato-edit-autocomplete"', 'autocomplete Edición')
          edit = replace_once(edit, '          overlayClass="jobtype-contrato-edit-select-overlay"\n          class="jobtype-contrato-edit-control', '          overlayClass="jobtype-contrato-edit-select-overlay"\n          :disabled="store.loading || esParaguay"\n          class="jobtype-contrato-edit-control', 'origen Edición')
          edit = edit.replace(':disabled="!puedeActualizar"', ':disabled="!puedeActualizar || store.loading"')
          edit = replace_once(
              edit,
              '  </Dialog>\n</template>',
              '  </Dialog>\n\n  <FmAlertDialog\n    v-model:visible="showError"\n    title="Error"\n    :message="errorMessage"\n  />\n</template>',
              'alerta de Edición'
          )

          edit_script = r'''<script setup>
          import { ref, computed, watch } from 'vue'
          import Dialog from 'primevue/dialog'
          import InputText from 'primevue/inputtext'
          import AutoComplete from 'primevue/autocomplete'
          import Select from 'primevue/select'
          import FmButton from '@/components/shared/FmButton.vue'
          import FmAlertDialog from '@/components/shared/FmAlertDialog.vue'
          import FmTypingLoader from '@/components/shared/FmTypingLoader.vue'
          import { useJobtypeContratoStore } from '../store/jobtypeContratoStore'

          const props = defineProps({
            visible: { type: Boolean, default: false },
            tareaContratoId: { type: Number, default: 0 },
            contratoTipoId: { type: Number, default: 0 },
            jobtypeCodigo: { type: String, default: '' },
            jobtype: { type: String, default: '' },
            contratoActual: { type: String, default: '' },
            pais: { type: String, default: '' },
            origenActual: { type: String, default: '' }
          })

          const emit = defineEmits(['update:visible', 'actualizado'])
          const store = useJobtypeContratoStore()

          const dialogStyle = 'width: min(900px, calc(100vw - 32px)); max-width: 900px;'
          const confirmDialogStyle = 'width: min(540px, calc(100vw - 32px)); max-width: 540px;'

          const nuevoContrato = ref('')
          const contratoSuggestions = ref([])
          const contratoSelectedItem = ref(null)
          const origenSeleccionado = ref('')
          const showConfirmCierre = ref(false)
          const showError = ref(false)
          const localError = ref('')

          const normalize = (value) => String(value ?? '').trim().toUpperCase()
          const normalizeCountry = (value) => {
            const country = normalize(value).replaceAll(' ', '')
            if (['1', 'ARG/UY', 'ARGUY', 'ARGENTINA/URUGUAY', 'ARG', 'AR', 'UY'].includes(country)) return 'ARG/UY'
            if (['2', 'PY', 'PAR', 'PARAGUAY'].includes(country)) return 'PY'
            return normalize(value)
          }

          const esParaguay = computed(() => normalizeCountry(props.pais) === 'PY')
          const origenInicial = computed(() => esParaguay.value ? 'FAN' : normalize(props.origenActual))
          const origenOptions = computed(() => {
            const values = esParaguay.value ? ['FAN'] : ['', 'FAN', 'MXM']
            const actual = normalize(props.origenActual)
            if (actual && !values.includes(actual)) values.push(actual)
            return values.map((value) => ({ label: value, value }))
          })
          const contratoFinalId = computed(() => Number(
            contratoSelectedItem.value?.contratoId ?? props.contratoTipoId ?? 0
          ))
          const contratoFinalNombre = computed(() =>
            contratoSelectedItem.value?.nombre ?? props.contratoActual
          )
          const cambioContrato = computed(() => Boolean(
            contratoSelectedItem.value && contratoFinalId.value !== Number(props.contratoTipoId)
          ))
          const cambioOrigen = computed(() => normalize(origenSeleccionado.value) !== normalize(origenInicial.value))
          const hayCambios = computed(() => cambioContrato.value || cambioOrigen.value)
          const puedeActualizar = computed(() => Boolean(
            hayCambios.value && contratoFinalId.value > 0 && origenSeleccionado.value
          ))
          const errorMessage = computed(() => localError.value || store.error || 'Error de conexión. Contacte al administrador')

          watch(() => props.visible, (visible) => {
            if (visible) resetForm()
            else showConfirmCierre.value = false
          })

          const resetForm = () => {
            nuevoContrato.value = ''
            contratoSelectedItem.value = null
            origenSeleccionado.value = origenInicial.value
            showConfirmCierre.value = false
            showError.value = false
            localError.value = ''
            store.clearError()
          }

          const buscarContratos = async (event) => {
            contratoSuggestions.value = await store.buscarContratos(event.query)
          }

          const onContratoSelect = (event) => {
            contratoSelectedItem.value = event.value
          }

          const existeDuplicado = () => store.relaciones.some((row) => {
            if (Number(row.tareaContratoId) === Number(props.tareaContratoId)) return false
            if (normalize(row.activo) === 'N') return false

            const sameCountry = normalizeCountry(row.pais) === normalizeCountry(props.pais)
            const rowJobtype = normalize(row.tareaCodigo || row.tareaNombre)
            const currentJobtype = normalize(props.jobtypeCodigo || props.jobtype)
            const sameContract = Number(row.contratoTipoId) === contratoFinalId.value ||
              normalize(row.contratoNombre) === normalize(contratoFinalNombre.value)
            const sameOrigin = normalize(row.origen) === normalize(origenSeleccionado.value)

            return sameCountry && rowJobtype === currentJobtype && sameContract && sameOrigin
          })

          const actualizar = async () => {
            if (!puedeActualizar.value || store.loading) return

            localError.value = ''
            store.clearError()

            if (existeDuplicado()) {
              localError.value = 'La relación Jobtype / Contrato / País / Origen ya existe y se encuentra activa.'
              showError.value = true
              return
            }

            try {
              await store.actualizarRelacion(
                props.tareaContratoId,
                contratoFinalId.value,
                origenSeleccionado.value
              )
              cerrar()
              emit('actualizado')
            } catch {
              showError.value = true
            }
          }

          const solicitarCierre = () => {
            if (store.loading) return
            if (hayCambios.value) {
              showConfirmCierre.value = true
              return
            }
            cerrar()
          }

          const onVisibleChange = (visible) => {
            if (!visible) solicitarCierre()
          }

          const cancelarCierre = () => { showConfirmCierre.value = false }
          const confirmarCierre = () => {
            showConfirmCierre.value = false
            cerrar()
          }

          const cerrar = () => {
            resetForm()
            emit('update:visible', false)
          }
          </script>'''
          edit_script = re.sub(r'^          ', '', edit_script, flags=re.M)
          edit = re.sub(r'<script setup>.*?</script>', edit_script, edit, count=1, flags=re.S)
          edit = re.sub(r'\n?<style(?:\s+scoped|\s+scope)?[^>]*>.*?</style>\s*', '\n', edit, flags=re.S)
          edit_path.write_text(edit.rstrip() + '\n', encoding='utf-8')

          # Confirmación: sólo mover su CSS al global, sin tocar funcionalidad.
          confirm = confirm_path.read_text(encoding='utf-8')
          confirm = re.sub(r'\n?<style(?:\s+scoped|\s+scope)?[^>]*>.*?</style>\s*', '\n', confirm, flags=re.S)
          confirm_path.write_text(confirm.rstrip() + '\n', encoding='utf-8')

          # -----------------------------------------------------------------
          # 6. Store de main: contrato de datos extendido, sin cambiar endpoints.
          # -----------------------------------------------------------------
          store = r'''import { defineStore } from 'pinia'
          import { ref } from 'vue'

          export interface JobTypeContratoRow {
            tareaContratoId: number
            tareaCodigo: string
            tareaNombre: string
            contratoNombre: string
            origen?: string
            legajoModificacion: string
            fechaModificacion: string
            activo: string
            pais: string
            tareaId: number
            contratoTipoId: number
          }

          export interface JobTypeContratoError {
            tareaCodigo: string
            mensaje: string
          }

          export interface NuevaRelacion {
            relCodigoTarea: string
            relTarea: string
            relContratoId: number
            relContrato: string
            origen: string
            pais: string
          }

          export interface AutocompleteItem {
            id: number
            codigo: string
            nombre: string
            valor?: string
          }

          export interface ContratoItem {
            contratoId: number
            nombre: string
            valor?: string
          }

          const DEFAULT_ERROR = 'Error de conexión. Contacte al administrador'

          export const useJobtypeContratoStore = defineStore('jobtypeContrato', () => {
            const relaciones = ref<JobTypeContratoRow[]>([])
            const loading = ref(false)
            const error = ref<string | null>(null)

            const clearError = () => { error.value = null }

            const withLoading = async <T>(operation: () => Promise<T>): Promise<T> => {
              loading.value = true
              error.value = null
              try {
                return await operation()
              } catch (exception: unknown) {
                error.value = exception instanceof Error ? exception.message : DEFAULT_ERROR
                throw exception
              } finally {
                loading.value = false
              }
            }

            const fetchRelaciones = (): Promise<void> => withLoading(async () => {
              const response = await fetch('/pc/jobtypeContrato/getJobTypes.html')
              if (!response.ok) throw new Error(DEFAULT_ERROR)
              relaciones.value = await response.json()
            })

            const crearRelaciones = (nuevas: NuevaRelacion[]): Promise<JobTypeContratoError[]> => withLoading(async () => {
              const response = await fetch('/pc/jobtypeContrato/nuevaRelJobtypeContrato.html', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ nuevasRelaciones: JSON.stringify(nuevas) })
              })
              if (!response.ok) throw new Error(DEFAULT_ERROR)
              return await response.json()
            })

            const actualizarRelacion = (
              tareaContratoId: number,
              tipoContratoId: number,
              origen: string
            ): Promise<JobTypeContratoRow> => withLoading(async () => {
              const params = new URLSearchParams({
                tareaContratoId: String(tareaContratoId),
                tipoContratoId: String(tipoContratoId),
                origen
              })
              const response = await fetch(`/pc/jobtypeContrato/actualizarJobtype.html?${params}`)
              if (!response.ok) throw new Error(DEFAULT_ERROR)
              return await response.json()
            })

            const desactivarRelacion = (idRelacion: number): Promise<JobTypeContratoRow> => withLoading(async () => {
              const response = await fetch('/pc/jobtypeContrato/desactivarRelJobContrato.html', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ idRelacion: String(idRelacion) })
              })
              if (!response.ok) throw new Error(DEFAULT_ERROR)
              return await response.json()
            })

            const buscarJobtypes = async (phrase: string, pais: string): Promise<AutocompleteItem[]> => {
              if (phrase.length <= 3) return []
              try {
                const response = await fetch(`/pc/jobtypeContrato/getJobTypeTarea/${encodeURIComponent(phrase)}/${encodeURIComponent(pais)}.html`)
                return response.ok ? await response.json() : []
              } catch {
                return []
              }
            }

            const buscarContratos = async (phrase: string): Promise<ContratoItem[]> => {
              if (phrase.length <= 3) return []
              try {
                const response = await fetch(`/pc/jobtypeContrato/getContrato/${encodeURIComponent(phrase)}.html`)
                return response.ok ? await response.json() : []
              } catch {
                return []
              }
            }

            return {
              relaciones,
              loading,
              error,
              clearError,
              fetchRelaciones,
              crearRelaciones,
              actualizarRelacion,
              desactivarRelacion,
              buscarJobtypes,
              buscarContratos
            }
          })
          '''
          store = re.sub(r'^          ', '', store, flags=re.M)
          store_path.write_text(store, encoding='utf-8')

          # El workflow es temporal y no queda en el commit funcional.
          workflow = root / '.github/workflows/integrate-jobtype-main-functionality.yml'
          if workflow.exists():
              workflow.unlink()
          PYCODE

      - name: Validar estructura, diseño y funcionalidad
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c 'INICIO: jobtype-contrato-main-funcionalidad.css' src/assets/css/fm-global.css)" -eq 1
          test "$(grep -c 'FIN: jobtype-contrato-main-funcionalidad.css' src/assets/css/fm-global.css)" -eq 1
          ! grep -R '<style' src/modules/parametrizaciones/jobtypeContrato --include='*.vue'
          ! find src/modules/parametrizaciones/jobtypeContrato -type f -name '*.css' | grep -q .
          grep -q 'Jobtype_Contrato.xlsx' src/modules/parametrizaciones/jobtypeContrato/JobtypeContrato.vue
          grep -q 'useExcelExport' src/modules/parametrizaciones/jobtypeContrato/JobtypeContrato.vue
          grep -q 'rowSelectable' src/modules/parametrizaciones/jobtypeContrato/components/Tabla.vue
          grep -q 'isExistingActiveRelation' src/modules/parametrizaciones/jobtypeContrato/components/AltaDialog.vue
          grep -q 'existeDuplicado' src/modules/parametrizaciones/jobtypeContrato/components/EditarDialog.vue
          grep -q 'origen: string' src/modules/parametrizaciones/jobtypeContrato/store/jobtypeContratoStore.ts
          grep -q "component: () => import('../modules/parametrizaciones/jobtypeContrato/JobtypeContrato.vue')" src/router/index.js
          ! grep -R 'JobtypeContratoPage.vue\|AltaJobtypeContratoDialog.vue\|EditarJobtypeContratoDialog.vue' src/router src/modules/parametrizaciones/jobtypeContrato

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Confirmar integración validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrar funcionalidad nueva de Jobtype sobre main"
          git push origin HEAD:jobtype-contrato-funcionalidad-main
