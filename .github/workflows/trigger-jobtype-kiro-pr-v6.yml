name: Validar integración Jobtype Kiro v6

on:
  pull_request:
    branches:
      - jobtype-contrato-integracion-kiro
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de integración
        uses: actions/checkout@v4
        with:
          ref: jobtype-contrato-integracion-kiro
          fetch-depth: 0

      - name: Descargar respaldo visual
        run: git fetch origin backup-jobtype-contrato-pre-kiro:refs/remotes/origin/backup-jobtype-contrato-pre-kiro

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar la integración completa
        shell: bash
        run: |
          set -euo pipefail
          python <<'PYCODE'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/trigger-jobtype-kiro-pr-v5.yml').read_text(encoding='utf-8')
          match = re.search(r"          python <<'PYCODE'\n(.*?)\n          PYCODE", source, flags=re.S)
          if not match:
              raise SystemExit('No se encontró el script completo v5')
          exec(compile(textwrap.dedent(match.group(1)), '<jobtype-kiro-v5>', 'exec'))
          current = Path('.github/workflows/trigger-jobtype-kiro-pr-v6.yml')
          if current.exists():
              current.unlink()
          PYCODE

      - name: Diagnosticar y validar cada condición
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local label="$1"
            shift
            if "$@"; then
              echo "OK: $label"
            else
              echo "FAIL: $label"
              exit 1
            fi
          }

          check "sección global consolidada" grep -q "INICIO: jobtype-contrato-consolidado-final.css" src/assets/css/fm-global.css
          check "sección funcional Kiro" grep -q "INICIO: jobtype-contrato-funcionalidades-kiro.css" src/assets/css/fm-global.css

          if grep -R "<style" src/modules/parametrizaciones/jobtypeContrato --include='*.vue'; then
            echo "FAIL: quedaron estilos dentro de componentes"
            exit 1
          fi
          echo "OK: componentes sin style"

          if grep -R "jobtypeContrato/styles" src/main.js src/modules/parametrizaciones/jobtypeContrato --include='*.js' --include='*.ts' --include='*.vue'; then
            echo "FAIL: quedaron imports del directorio styles"
            exit 1
          fi
          echo "OK: sin imports CSS del módulo"

          check "directorio styles eliminado" test ! -d src/modules/parametrizaciones/jobtypeContrato/styles
          check "payload temporal eliminado" test ! -d .github/jobtype-kiro-payload
          check "filas inactivas no seleccionables" grep -q "rowSelectable" src/modules/parametrizaciones/jobtypeContrato/pages/JobtypeContratoPage.vue
          check "duplicados de Alta" grep -q "isExistingActiveRelation" src/modules/parametrizaciones/jobtypeContrato/dialogs/AltaJobtypeContratoDialog.vue
          check "duplicados de Edición" grep -q "existeDuplicado" src/modules/parametrizaciones/jobtypeContrato/dialogs/EditarJobtypeContratoDialog.vue
          check "limpieza de errores del store" grep -q "clearError" src/modules/parametrizaciones/jobtypeContrato/store/jobtypeContratoStore.ts
          check "persistencia de origen en API" grep -q "origen" src/modules/parametrizaciones/jobtypeContrato/api/jobtypeContratoApi.ts

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Confirmar cambios validados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrar nuevas funcionalidades de Jobtype-Contrato"
          git push origin HEAD:jobtype-contrato-integracion-kiro
