name: Ajustar botones CMO

on:
  push:
    branches:
      - CMO

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama CMO
        uses: actions/checkout@v4
        with:
          ref: CMO
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Aplicar ajuste visual
        run: python .github/scripts/fix_cmo_buttons.py

      - name: Validar estilos centralizados
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R 'border-radius: 0 !important' src/modules/parametrizaciones/jobtypeCMO/components --include='*.vue'
          ! grep -R 'style=.*jobtype-\(add\|relate\)-button' src/modules/parametrizaciones/jobtypeCMO/components --include='*.vue'
          grep -q 'Botones CMO iguales a Jobtype-Contrato' src/assets/css/fm-global.css
          grep -q 'border-radius: 8px !important' src/assets/css/fm-global.css
          grep -q 'min-width: 110px !important' src/assets/css/fm-global.css
          ! grep -R '<style' src/modules/parametrizaciones/jobtypeCMO --include='*.vue'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Limpiar archivos técnicos y confirmar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix_cmo_buttons.py
          rm -f .github/workflows/run-cmo-button-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Igualar botones CMO con Jobtype-Contrato"
          git push origin HEAD:CMO
