name: Actualizar Jobtype con estilos globales

on:
  push:
    branches:
      - arquitectura-componentes-globales

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar rama Jobtype
        uses: actions/checkout@v4
        with:
          ref: arquitectura-componentes-globales
          fetch-depth: 0

      - name: Obtener infraestructura visual actual
        run: git fetch origin main

      - name: Consolidar menú, margen y CSS
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import subprocess

          css_dir = Path('src/assets/css')
          global_path = css_dir / 'fm-global.css'
          theme_path = css_dir / 'theme.css'
          main_path = Path('src/main.js')
          iframe_plugin = Path('src/plugins/responsiveIframes.js')

          global_css = subprocess.check_output(
              ['git', 'show', 'origin/main:src/assets/css/fm-global.css'],
              text=True,
          )

          # ABM Materiales pertenece a otra funcionalidad y no debe entrar en Jobtype.
          global_css = re.sub(
              r'\n?/\* ===== INICIO: abm-materiales\.css ===== \*/.*?'
              r'/\* ===== FIN: abm-materiales\.css ===== \*/\n?',
              '\n',
              global_css,
              flags=re.DOTALL,
          ).rstrip() + '\n'

          extra_sections = []
          css_files = sorted(Path('src').rglob('*.css'))

          # Conserva los ajustes actuales de Jobtype al final del global para que
          # prevalezcan sobre la versión histórica ya consolidada.
          for path in css_files:
              if path in {global_path, theme_path}:
                  continue

              content = path.read_text(encoding='utf-8').strip()
              marker = f'/* ===== INICIO: {path.name} ===== */'
              is_jobtype = 'jobtypeContrato' in path.as_posix() or 'jobtype-contrato' in path.name

              if content and (is_jobtype or marker not in global_css):
                  extra_sections.append(
                      '\n'.join([
                          f'/* ===== INICIO: {path.as_posix()} ===== */',
                          '/* [MÓDULO / PANTALLA] Ajuste vigente trasladado a fm-global.css. */',
                          content,
                          f'/* ===== FIN: {path.as_posix()} ===== */',
                      ])
                  )

          # Los componentes Jobtype tampoco deben conservar bloques <style>.
          jobtype_roots = [
              Path('src/modules/parametrizaciones/jobtypeContrato'),
              Path('src/modules/jobtypeContrato'),
          ]
          style_pattern = re.compile(r'<style(?:\s[^>]*)?>(.*?)</style>', re.DOTALL | re.IGNORECASE)

          for root in jobtype_roots:
              if not root.exists():
                  continue
              for vue_file in sorted(root.rglob('*.vue')):
                  source = vue_file.read_text(encoding='utf-8')
                  blocks = style_pattern.findall(source)
                  for index, block in enumerate(blocks, start=1):
                      css = block.strip()
                      if css:
                          extra_sections.append(
                              '\n'.join([
                                  f'/* ===== INICIO: {vue_file.as_posix()}#style-{index} ===== */',
                                  '/* [MÓDULO / PANTALLA] Estilo del componente Jobtype centralizado. */',
                                  css,
                                  f'/* ===== FIN: {vue_file.as_posix()}#style-{index} ===== */',
                              ])
                          )
                  cleaned = style_pattern.sub('', source)
                  cleaned = re.sub(r'\n{3,}', '\n\n', cleaned).rstrip() + '\n'
                  if cleaned != source:
                      vue_file.write_text(cleaned, encoding='utf-8')

          if extra_sections:
              global_css = global_css.rstrip() + '\n\n' + '\n\n'.join(extra_sections) + '\n'
          global_path.write_text(global_css, encoding='utf-8')

          # responsiveIframes continúa leyendo sólo la sección legacy, ahora desde
          # la única hoja CSS del proyecto.
          if iframe_plugin.exists():
              plugin = iframe_plugin.read_text(encoding='utf-8')
              raw_import = re.compile(
                  r"^\s*import\s+legacyResponsiveCss\s+from\s+['\"]@/assets/css/"
                  r"fm-legacy-responsive\.css\?raw['\"]\s*;?\s*$",
                  re.MULTILINE,
              )
              replacement = """import globalCss from '@/assets/css/fm-global.css?raw'

const LEGACY_START = '/* ===== INICIO: fm-legacy-responsive.css ===== */'
const LEGACY_END = '/* ===== FIN: fm-legacy-responsive.css ===== */'
const legacyStartIndex = globalCss.indexOf(LEGACY_START)
const legacyEndIndex = globalCss.indexOf(LEGACY_END)

if (legacyStartIndex === -1 || legacyEndIndex <= legacyStartIndex) {
  throw new Error('No se encontró la sección responsive legacy en fm-global.css')
}

const legacyResponsiveCss = globalCss
  .slice(legacyStartIndex + LEGACY_START.length, legacyEndIndex)
  .trim()"""
              plugin = raw_import.sub(replacement, plugin)
              iframe_plugin.write_text(plugin, encoding='utf-8')

          # Quita importaciones locales de CSS, incluso cuando tienen comentarios
          # al final de la línea. PrimeIcons y PrimeFlex no son rutas locales.
          local_css_import = re.compile(
              r"^\s*import\s+['\"](?P<path>(?:\.{1,2}/|@/)[^'\"]+\.css(?:\?raw)?)"
              r"['\"]\s*;?\s*(?://.*)?$",
              re.MULTILINE,
          )

          for source_file in Path('src').rglob('*'):
              if not source_file.is_file() or source_file.suffix.lower() not in {'.js', '.ts', '.vue'}:
                  continue
              source = source_file.read_text(encoding='utf-8')

              def remove_local_css(match):
                  imported = match.group('path')
                  if imported.endswith('fm-global.css') or imported.endswith('fm-global.css?raw'):
                      return match.group(0)
                  if imported.endswith('theme.css'):
                      return match.group(0)
                  return ''

              cleaned = local_css_import.sub(remove_local_css, source)
              cleaned = re.sub(r'\n{3,}', '\n\n', cleaned)
              if cleaned != source:
                  source_file.write_text(cleaned, encoding='utf-8')

          # main.js carga fm-global.css una sola vez.
          main_source = main_path.read_text(encoding='utf-8')
          main_source = re.sub(
              r"^\s*import\s+['\"]\.\/assets\/css\/fm-global\.css['\"]\s*;?\s*$",
              '',
              main_source,
              flags=re.MULTILINE,
          )
          global_import = "import './assets/css/fm-global.css'"
          anchor = "import 'primeflex/primeflex.css'"
          if anchor in main_source:
              main_source = main_source.replace(anchor, anchor + '\n' + global_import, 1)
          else:
              main_source = global_import + '\n' + main_source
          main_source = re.sub(r'\n{3,}', '\n\n', main_source)
          main_path.write_text(main_source, encoding='utf-8')

          # Borra las hojas absorbidas; theme.css se conserva como tema base.
          for path in css_files:
              if path not in {global_path, theme_path} and path.exists():
                  path.unlink()

          # Documentación y archivos temporales.
          try:
              readme = subprocess.check_output(
                  ['git', 'show', 'origin/main:README_ESTILOS.md'],
                  text=True,
              )
              Path('README_ESTILOS.md').write_text(readme, encoding='utf-8')
          except subprocess.CalledProcessError:
              pass

          Path('.github/jobtype-sync-probe.txt').unlink(missing_ok=True)

          # Validaciones estructurales antes del build.
          final_global = global_path.read_text(encoding='utf-8')
          required = [
              '/* ===== INICIO: fm-menu-responsive.css ===== */',
              '/* ===== INICIO: fm-menu-tuning.css ===== */',
              '/* ===== INICIO: fm-menu-spacing.css ===== */',
              '/* ===== INICIO: fm-menu-submenu-compact.css ===== */',
          ]
          missing = [marker for marker in required if marker not in final_global]
          if missing:
              raise SystemExit(f'Faltan secciones globales: {missing}')
          if '/* ===== INICIO: abm-materiales.css ===== */' in final_global:
              raise SystemExit('ABM Materiales no debe incorporarse a esta rama')
          if main_path.read_text(encoding='utf-8').count(global_import) != 1:
              raise SystemExit('main.js debe importar fm-global.css exactamente una vez')

          remaining_css = [
              path.as_posix() for path in Path('src').rglob('*.css')
              if path not in {global_path, theme_path}
          ]
          if remaining_css:
              raise SystemExit(f'Quedaron hojas CSS dispersas: {remaining_css}')

          remaining_styles = []
          for root in jobtype_roots:
              if root.exists():
                  for vue_file in root.rglob('*.vue'):
                      if re.search(r'<style(?:\s|>)', vue_file.read_text(encoding='utf-8'), re.IGNORECASE):
                          remaining_styles.append(vue_file.as_posix())
          if remaining_styles:
              raise SystemExit(f'Quedaron estilos locales en Jobtype: {remaining_styles}')
          PY

      - name: Validar aplicación
        run: |
          npm ci
          npm run build
          git diff --check

      - name: Confirmar actualización de Jobtype
        run: |
          rm -f .github/workflows/sync-jobtype-global.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar Jobtype con menú, margen y CSS global"
          git push origin HEAD:arquitectura-componentes-globales
