name: Ejecutar corrección definitiva CMO

on:
  push:
    branches:
      - CMO

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama CMO
        uses: actions/checkout@v4
        with:
          ref: CMO
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Aplicar corrección
        run: python .github/scripts/fix_cmo_popups.py

      - name: Validar estructura
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c 'INICIO: cmo-actividad.css' src/assets/css/fm-global.css)" -eq 1
          test "$(grep -c 'FIN: cmo-actividad.css' src/assets/css/fm-global.css)" -eq 1
          grep -q 'class="jobtype-alta-dialog cmo-alta-dialog"' src/modules/parametrizaciones/jobtypeCMO/components/AltaDialogBackend.vue
          grep -q 'class="jobtype-alta-dialog cmo-modificar-dialog"' src/modules/parametrizaciones/jobtypeCMO/components/ModificarDialog.vue
          grep -q 'cmo-alta-form > .jobtype-alta-field:nth-child(1)' src/assets/css/fm-global.css
          grep -q 'cmo-modificar-form > .jobtype-alta-field:nth-child(3)' src/assets/css/fm-global.css
          ! grep -R '<style' src/modules/parametrizaciones/jobtypeCMO --include='*.vue'
          ! find src/modules/parametrizaciones/jobtypeCMO -type f -name '*.css' | grep -q .

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Limpiar archivos técnicos y confirmar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix_cmo_popups.py
          rm -f .github/workflows/run-cmo-popup-fix.yml
          rm -f .github/workflows/fix-cmo-popup-layout-final.yml
          rm -f .github/workflows/fix-cmo-popup-layout-final-v2.yml
          rm -f .github/workflows/restore-cmo-popups.yml
          rm -f .github/workflows/restore-cmo-popups-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregir definitivamente layout de popups CMO"
          git push origin HEAD:CMO
