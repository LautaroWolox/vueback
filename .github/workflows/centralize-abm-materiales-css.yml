name: Centralizar CSS ABM Materiales

on:
  push:
    branches:
      - ABM-Materiales
  pull_request:
    branches:
      - ABM-Materiales
  workflow_dispatch:

permissions:
  contents: write

jobs:
  centralize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ABM-Materiales
          fetch-depth: 0

      - name: Centralizar estilos y limpiar componentes
        shell: python
        run: |
          import base64
          import hashlib
          import re
          from pathlib import Path

          root = Path('.')
          part_paths = sorted((root / '.github').glob('abm-css-part*.txt'))
          if not part_paths:
              raise SystemExit('No se encontraron las partes temporales del CSS.')

          encoded = ''.join(
              re.sub(r'\s+', '', path.read_text(encoding='utf-8'))
              for path in part_paths
          )
          section_bytes = base64.b64decode(encoded, validate=True)
          expected_size = 18164
          expected_sha256 = '67af7589505db3fe7dc74a3743474de126aabfc8e29f17a6013abff9d2a85531'
          actual_sha256 = hashlib.sha256(section_bytes).hexdigest()

          if len(section_bytes) != expected_size or actual_sha256 != expected_sha256:
              raise SystemExit(
                  f'Bloque CSS inválido: size={len(section_bytes)}, sha256={actual_sha256}'
              )

          section = section_bytes.decode('utf-8').strip()
          global_path = root / 'src/assets/css/fm-global.css'
          global_css = global_path.read_text(encoding='utf-8')
          start = '/* ===== INICIO: abm-materiales.css ===== */'
          end = '/* ===== FIN: abm-materiales.css ===== */'
          pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)

          if len(pattern.findall(global_css)) != 1:
              raise SystemExit('No se encontró una única sección ABM Materiales en fm-global.css.')

          global_path.write_text(
              pattern.sub(section, global_css),
              encoding='utf-8'
          )

          component_paths = [
              root / 'src/modules/gestionMateriales/abmMateriales/AbmMateriales.vue',
              root / 'src/modules/gestionMateriales/abmMateriales/components/EditarMaterialDialog.vue',
          ]
          style_pattern = re.compile(r'\n<style(?:\s[^>]*)?>.*?</style>\s*$', re.S)

          for component_path in component_paths:
              content = component_path.read_text(encoding='utf-8')
              cleaned, count = style_pattern.subn('\n', content)
              if count != 1:
                  raise SystemExit(
                      f'Se esperaba un bloque <style> en {component_path}, encontrados: {count}'
                  )
              component_path.write_text(cleaned, encoding='utf-8')

          for path in part_paths:
              path.unlink()

          workflow_path = root / '.github/workflows/centralize-abm-materiales-css.yml'
          workflow_path.unlink()

      - name: Confirmar cambios en ABM-Materiales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/css/fm-global.css \
            src/modules/gestionMateriales/abmMateriales/AbmMateriales.vue \
            src/modules/gestionMateriales/abmMateriales/components/EditarMaterialDialog.vue \
            .github
          git commit -m "Centralizar estilos de ABM Materiales en fm-global.css"
          git push origin HEAD:ABM-Materiales
