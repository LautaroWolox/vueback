'''
          if 'GESTIÓN DE ACTAS - PARIDAD FINAL CON PANTALLAS MIGRADAS' not in css:
              css += block
          cssp.write_text(css+'\n',encoding='utf-8')

          # Ya no se necesitan fachadas si no hay imports.
          combined='\n'.join(p.read_text(encoding='utf-8') for p in (consulta,nota,demo))
          if 'gestionActasLegacyApi' not in combined and 'gestionActasOperationsApi' not in combined:
              for p in [root/'src/modules/gestionActas/services/gestionActasLegacyApi.js',root/'src/modules/gestionActas/services/gestionActasOperationsApi.js']:
                  if p.exists(): p.unlink()
          PY
          python3 /tmp/normalize_actas.py

      - name: Structural assertions
        shell: bash
        run: |
          grep -q 'FmButton label="BUSCAR"' src/modules/gestionActas/views/GestionActasConsulta.vue
          grep -q 'gestion-open-ots' src/modules/gestionActas/views/NotaDcWorkspace.vue
          grep -q 'gestion-open-ots' src/modules/gestionActas/components/ActasWorkspaceDemo.vue
          grep -q 'useGestionActasStore' src/modules/gestionActas/components/ActasWorkspaceDemo.vue
          grep -q 'PARIDAD FINAL CON PANTALLAS MIGRADAS' src/assets/css/fm-global.css
          ! grep -R 'gestionActasLegacyApi\|gestionActasOperationsApi' src/modules/gestionActas --include='*.vue' --include='*.js' --include='*.ts'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cleanup workflows
        run: rm -f .github/workflows/actas-normalize-v2.yml .github/workflows/actas-normalize-migrated-ui.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(actas): igualar UI migrada, expandir grillas y habilitar multi OT'
          git push origin HEAD:feat-actas-stepper-multiseleccion
